re{display:flex;gap:6px;flex-wrap:wrap}.score span{background:#fff8;border-radius:99px;padding:6px 9px;font-size:12px}.score b{color:var(--red)}.panel{background:#fff9;border:1px solid #cfb789;border-radius:15px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 24px #49351f18}.chapter{color:var(--red);font-size:13px;font-weight:800}.panel h2{font:700 clamp(27px,6vw,39px) KaiTi,serif;color:var(--red);margin:8px 0}.context{font-size:18px;line-height:1.85}.knowledge{background:#fff1b7;border-left:5px solid var(--gold);padding:13px 15px;margin:18px 0;line-height:1.65}.options{display:grid;gap:12px;border-top:1px solid #d8c5a1;padding-top:18px}.option{text-align:left;line-height:1.55;min-height:62px}.option em{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#ffffff22;font-style:normal;margin-right:8px}.feedback{border-top:6px solid var(--jade)}.feedback.bad{border-top-color:var(--red)}.feedback.mid{border-top-color:var(--gold)}.outcome{font-size:20px;font-weight:800;color:var(--jade)}.feedback.bad .outcome{color:var(--red)}.feedback.mid .outcome{color:#8b661f}.reason{line-height:1.85;background:#f4ead4;padding:14px;border-radius:9px}.delta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.delta span{padding:6px 10px;border-radius:99px;background:#dfeae5;color:#315e53;font-size:13px;font-weight:700}.delta .minus{background:#f1dfdc;color:#8b3029}.result{text-align:center}.grade{font:800 120px/1 serif;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cards div{background:#ddc79c;border-radius:11px;padding:16px}.cards b{display:block;color:var(--red);font-size:28px}.review{text-align:left;background:#fff8;padding:15px 20px;border-radius:10px;line-height:1.75;margin:20px 0}.hidden{display:none!important}.legacy{display:inline-block;color:var(--muted);font-size:13px;margin-top:12px}footer{text-align:center;color:var(--muted);font-size:12px;margin:28px 0 0}
.event-bg{background:#eee2c9;border-left:5px solid var(--red);padding:14px 16px;border-radius:5px;line-height:1.8}.event-bg b,.continuity b{color:var(--red)}.continuity{background:#dfeae5;border:1px solid #aac1b8;border-radius:10px;padding:13px 15px;margin:14px 0;line-height:1.7}.route{display:inline-block;background:var(--red);color:#fff;border-radius:99px;padding:5px 10px;font-size:12px;margin-bottom:8px}.option small{display:block;color:#dce9e5;font-weight:400;margin:5px 0 0 34px}.timeline{border-left:3px solid #bfa777;padding-left:18px}.timeline li{margin:12px 0}.case-layout{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}.dossier{background:#f5ecd8;border:1px solid #c8b38c;border-radius:13px;padding:16px;position:sticky;top:12px}.dossier h3{font-family:KaiTi,serif;color:var(--red);margin:4px 0 12px}.section-label{color:var(--red);font-weight:800;border-bottom:1px solid #cdbb98;padding-bottom:6px;margin:14px 0 8px}.people{display:grid;grid-template-columns:1fr 1fr;gap:7px}.person,.evidence-item{background:#fff9;border:1px solid #d5c4a3;border-radius:7px;padding:8px;font-size:12px}.person b,.evidence-item b{display:block}.person span{color:var(--muted)}.evidence-list{display:grid;gap:6px}.evidence-item.locked{opacity:.42;filter:grayscale(1)}.judgment-list{font-size:12px;line-height:1.5;max-height:150px;overflow:auto;padding-left:18px}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:50}.modal-card{width:min(760px,100%);max-height:88vh;overflow:auto;background:#f8f0df;border:2px solid #8b744e;border-radius:12px;padding:clamp(20px,5vw,38px);box-shadow:0 0 45px #d6ad4b55;text-align:center}.modal-card .reason,.modal-card .knowledge{text-align:left}.modal-icon{font-size:46px}.modal-card h2{font-family:KaiTi,serif;color:var(--red);font-size:34px;margin:8px 0}.modal-card .primary{text-align:center;min-width:230px}.world-state{text-align:center;color:var(--muted);font-size:12px;margin:8px 0}

<script>
const O=(t,r,d)=>({t,r,d});
const cases=[
{id:'tiying',era:'西汉 · 公元前167年',title:'缇萦上书',sub:'肉刑存废与改革效果',intro:'担任廷尉属官，从淳于意案出发，设计一场既有人道目标、又能落地执行的刑制改革。',qs:[
['卷宗定性','淳于意将受肉刑，缇萦上书称受刑者“虽欲改过自新，其道莫由”。你首先抓住什么争点？','汉初刑制承袭秦制，肉刑具有不可逆性。',[O('讨论刑罚是否给改过者保留复归可能','朝议转向刑罚目的。因为缇萦指出的不是父亲身份，而是不可逆刑罚阻断改过。',[2,3,2]),O('强调缇萦孝心足以直接免罪','淳于意获得同情，但制度问题被遮蔽。孝行能触发审视，却不能替代对罪责与刑制的分析。',[1,0,2]),O('认定旧法存在多年便无需讨论','改革被拒绝。制度沿用时间不能单独证明其合理，尤其当新个案暴露稳定缺陷时。',[0,-2,-1])]],
['史实边界','有人说：“汉代已经确立现代人权，所以必然废肉刑。”你如何记录？','古今概念可以对话，但不能把现代体系直接投射到汉代。',[O('删除“现代人权”断言，改从汉初约法省刑与仁政语境分析','论证更可靠。因为历史评价必须先尊重当时制度与政治语言。',[3,2,1]),O('保留说法，现代价值正确即可','表达鲜明但史实失真。价值赞同不能证明古代已经存在同一权利结构。',[-2,0,1]),O('完全拒绝现代视角','避免了套用，却失去借古鉴今。恰当方法是标明距离后再比较。',[1,1,0])]],
['刑罚目的','廷尉正主张“残损身体最能威慑”。你如何回应？','刑罚效果不能只凭严酷程度推定。',[O('要求比较威慑收益与不可逆伤害，并考察再犯和复归','讨论进入可检验层面。严厉不天然等于有效，还要评估社会成本。',[2,3,2]),O('只说仁慈就是最好的刑罚','立场温和但论据不足。刑制仍须回应秩序、比例与执行问题。',[1,0,2]),O('赞同越残酷越有效','旧制继续维持。该推论忽略秦亡教训，也没有证明严酷与治理效果的因果。',[0,-2,-2])]],
['替代方案','文帝准备废除肉刑，问你如何配置替代刑。','历史上部分肉刑被髡钳、笞刑等替代。',[O('按罪责分级替代，并设置最高笞数','方案兼顾比例与人道。分级可避免轻重罪一律折算造成新的失衡。',[2,3,2]),O('所有肉刑统一改为五百笞','形式统一却可能更致命。笞数过高会让“减刑”在执行中变成变相死刑。',[1,-2,-1]),O('只赦免淳于意，不改一般规则','个案获救，结构问题仍会重复。个案救济不能自动代替制度改革。',[1,0,1])]],
['执行规范','地方狱吏问笞刑应如何执行。','替代刑是否进步，取决于真实执行。',[O('统一刑具、限定部位、记录次数并允许复核','伤亡风险下降。程序限制能把仁政目标转化为可监督的行为规则。',[2,3,2]),O('只写“务必仁慈”','口号难以约束执行。没有具体标准，地方仍可能因习惯和压力滥刑。',[1,0,1]),O('由狱吏自行掌握轻重','执行差异扩大。把全部裁量交给行刑者会增加任意与寻租空间。',[0,-2,-2])]],
['伤亡奏报','新制后有人因重笞死亡，朝中称改革已经失败。','改革可能方向正确、设计不足。',[O('承认替代刑缺陷，降低笞数并继续评估','改革得到修正。发现副作用后调整规则，比否认问题或全盘倒退更合理。',[3,3,2]),O('隐瞒伤亡以维护圣明','短期保住颜面，长期损害制度学习。没有真实信息就无法纠正执行偏差。',[0,-2,-2]),O('立即恢复全部肉刑','解决了笞刑问题，却回到不可逆伤残。单一失败不证明旧制最优。',[1,-1,-1])]],
['罪刑相当','轻罪与重罪都采用接近的笞数，引发争议。','刑罚配置需要区别罪责轻重。',[O('重新建立轻重阶梯，并审查实际痛苦程度','比例失衡得到缓解。名称相同不代表严厉程度相同，须看真实负担。',[2,3,2]),O('只要形式统一就是公平','形式一致掩盖实质差异。公平还要求罪责与制裁强度相适应。',[1,-1,0]),O('全部加重以免放纵','轻罪者承受过度制裁。用普遍加重解决分类失败，会扩大不公。',[0,-2,-2])]],
['复归社会','受刑者刑满后被乡里永久排斥。','缇萦上书特别强调改过无路。',[O('减少永久污名，并允许以守法表现恢复身份','刑罚终了后的复归路径形成。否则法律宣布刑满，社会惩罚却无限延续。',[2,3,3]),O('认为社会排斥不属于刑制问题','制度只完成一半。正式刑罚与持续污名共同决定受刑者能否改过。',[1,0,-1]),O('给所有受刑者永久标记','管理更方便，却复制肉刑的终身污名逻辑，违背改革起点。',[0,-2,-2])]],
['评价改革','史官问文帝废肉刑是否等于刑罚全面轻缓。','历史结论要区分诏令、替代规则和执行结果。',[O('评价为重要转向，但指出替代刑仍有严酷与反复','结论有边界。既承认改革意义，也没有把复杂过程写成直线进步。',[3,3,2]),O('宣布从此再无酷刑','叙事漂亮却夸大史实。替代刑伤亡说明制度效果并非一次完成。',[-2,-1,1]),O('因有副作用而否定全部意义','忽视了不可逆肉刑被废的方向性变化。缺陷不等于毫无进步。',[1,0,0])]],
['总结奏章','你如何向文帝概括本案启示？','最后结论应同时回应历史语境与制度效果。',[O('废肉刑是起点；刑罚还须罪责相称、执行可控、容许复归','奏章成为持续改革纲领。它完整回应了目的、比例、程序与效果。',[3,3,3]),O('圣君仁德感化天下即可','具有时代语言，却把复杂制度成败归于个人品德，缺少可执行结构。',[2,0,2]),O('旧制不可变，个案不足为训','缇萦上书的制度价值被抹去。反复出现的结构性伤害不能永远被视为例外。',[0,-2,-2])]]]},
{id:'shangyang',era:'战国秦 · 公元前356年',title:'商鞅变法',sub:'法令公开、军功与连坐',intro:'担任秦国法吏，面对改革动员、法令信用、军功爵制和连坐边界，判断“强国之法”的收益与代价。',qs:[
['变法开局','新法将行，百姓疑而不信。你如何建立法令信用？','徙木立信的故事体现变法者对法令可信度的重视。',[O('公开规则、兑现奖赏，并让官吏同受约束','新法获得初步信用。可预期执行比单纯恐吓更能形成稳定服从。',[2,3,2]),O('先重罚几个质疑者','恐惧上升但信用未建立。惩罚怀疑者不能证明政府会守诺。',[1,-1,-2]),O('只靠口头宣讲君主英明','宣传扩大，却缺少可验证承诺。法令信用来自一致兑现。',[1,0,1])]],
['法令公开','有官员主张只让官吏掌握细则，方便临事处置。','成文规则公开关系到行为预期与裁量边界。',[O('公布主要规则、奖罚标准与申诉渠道','百姓能够预见后果，官吏也较难任意解释。公开性提升了治理稳定。',[2,3,2]),O('只公布惩罚，不公布奖励','威慑突出但激励失真。片面公开会削弱法令完整信用。',[1,0,-1]),O('完全保密，违法后再告知','行政方便却制造不可预期。无法知悉的规则难以引导行为。',[0,-2,-2])]],
['军功爵制','旧贵族要求按血缘继续授爵，军中要求按功行赏。','军功爵制冲击世卿世禄。',[O('以可核实军功授爵，并防止冒功','动员能力增强，身份流动扩大。核验机制可减少新制度被造假侵蚀。',[3,3,2]),O('完全维持血缘授爵','旧贵族满意，改革目标落空。资源仍按出身分配，军功激励不足。',[2,-1,-1]),O('谁献首级最多谁升爵，不审来源','短期战果增加，冒功与滥杀风险上升。指标若可被操纵会反噬制度。',[1,-2,-2])]],
['连坐范围','一户犯罪，里伍是否都应连坐？','连坐有强化控制和信息互监的功能，也可能扩大无过者责任。',[O('仅对明知、协助或依法负有报告义务而故意不报者追责','责任边界更清楚。把主观知情与法定义务纳入，可减少无差别株连。',[1,3,2]),O('邻里一律同罪','告发增加，但无过者也受罚。无差别连坐以恐惧换信息，社会信任成本很高。',[2,-2,-2]),O('任何情形都不追究协助者','避免株连，却可能放任共同隐匿。关键应区分独立责任与纯粹身份牵连。',[1,1,0])]],
['太子犯法','太子触犯新法，群臣担心直接处罚动摇储位。','史载商鞅通过处罚太子师傅等方式彰显新法。',[O('坚持规则不能因身份失效，同时按当时制度处理责任','法令权威增强。核心是避免特权使公开规则沦为空文。',[3,3,2]),O('秘密免除，维护王室颜面','政治冲突暂缓，法令信用受损。百姓会据此判断新法只约束弱者。',[1,-2,-1]),O('为示公平立即废黜太子','姿态强硬但超出比例。平等适用不等于不考虑权限和相称性。',[1,0,-2])]],
['告奸激励','地方以告发数量考核，出现大量诬告。','激励指标会改变行为，也可能制造滥用。',[O('核查证据，惩治故意诬告，并调整单一数量考核','真实案件比例提高。纠错机制防止告发制度被私人报复利用。',[2,3,2]),O('告得越多奖励越高','数字漂亮，诬告激增。单一数量指标鼓励追求数量而非真实性。',[1,-2,-2]),O('取消一切举报','诬告下降，但真实违法线索也消失。应治理滥用而非废掉全部信息渠道。',[1,0,0])]],
['重刑主义','有人建议轻罪重罚，让百姓不敢试法。','商鞅法家思想重刑威慑，但效果与代价需分别分析。',[O('评估威慑边际效果，并保留罪责轻重阶梯','秩序目标与比例控制并存。重罚不是无限增加就无限有效。',[1,3,2]),O('所有初犯一律重罚','短期服从上升，纠错和复归空间缩小。过度惩罚也会增加逃亡与对抗。',[2,-2,-2]),O('只进行道德劝说，不设处罚','缺乏执行后果，新法难以稳定。教化与制裁并非只能二选一。',[1,0,1])]],
['官吏执法','县吏对富户从轻、对贫户从重。','“壹刑”理想强调法令统一，但秦制并非现代平等法治。',[O('纠正差等执行，并公开复核结果','法令一致性提高。选择性执法会让规则成为权力工具。',[2,3,2]),O('富户能纳粮，应当从轻','短期财政受益，制度公信下降。以资源换免责破坏统一标准。',[1,-2,-1]),O('为反特权只处罚富户','方向看似矫正，仍是按身份而非行为裁判。',[1,0,-1])]],
['成效评估','秦国强盛后，有人称一切改革手段都因此正当。','国家能力提升不自动消除个体权利与社会成本问题。',[O('区分富国强兵成效、法令技术与高压控制代价','评价更完整。制度可以在某一目标上有效，同时在其他价值上代价高昂。',[3,3,2]),O('结果强国，所以所有措施正确','把结果成功当作全部正当性。该推理忽略手段边界与长期后果。',[1,-2,0]),O('因秦二世而亡，变法毫无作用','以最终结局抹去阶段成效，同样过度简化。历史因果不能单线归结。',[1,0,0])]],
['历史结论','如何总结商鞅变法的法制史意义？','应同时看到成文法、国家治理能力与严密控制。',[O('它强化公开法令和官僚治理，也以重刑连坐付出高压代价','结论兼顾制度创新与历史局限，避免英雄化或妖魔化。',[3,3,3]),O('它完整建立现代法治','概念错置。法令统一和现代权利法治不是同一制度。',[-2,-1,1]),O('它只是残酷刑罚，没有其他影响','抓住代价却遗漏国家治理、爵制与社会结构变化。',[1,0,0])]]]},
{id:'tanglv',era:'唐 · 律疏体系',title:'唐律断案',sub:'礼法结合与同居相隐',intro:'担任大理寺评事，处理亲属隐匿、身份差等、官吏枉法与证据判断，理解《唐律疏议》的体系与边界。',qs:[
['亲属藏匿','甲盗官物后藏于兄家，兄明知却未告发。首先查什么？','唐律对亲属相隐有制度安排，但范围与重罪例外需具体判断。',[O('查亲属关系、罪名性质及相隐规则的适用范围','审理路径正确。先确定规范要件，才能判断隐匿是否被容许或减免。',[3,3,2]),O('凡不告发一律同罪','忽略亲属相隐规则。唐律并非把所有知情不举都等同正犯。',[1,-2,-1]),O('亲属关系可免除任何罪责','把相隐绝对化。古代规则仍有范围、身份与严重犯罪限制。',[1,-1,0])]],
['礼法关系','御史说“礼就是道德，与断案无关”。','唐律以礼入法，但礼与律仍有不同表现形式。',[O('说明礼制影响亲属、身份和名分规范，须通过具体律文适用','礼法关系被落实到规范层面。不能只讲抽象伦理，也不能否认其制度作用。',[3,3,2]),O('完全赞同，律与礼互不相干','遗漏唐律的重要结构特征。许多罪名和量刑都受伦常名分影响。',[0,-2,-1]),O('只凭礼意即可越过律文判案','礼成为无限裁量。礼法结合不意味着官员可抛开成文规范。',[1,-2,-2])]],
['十恶判断','案中被告被指“不孝”，是否当然属于十恶？','十恶是特定严重犯罪类别，不能把日常道德评价直接当作罪名。',[O('核对行为是否满足律文中的具体构成','避免标签定罪。道德谴责必须转化为明确的规范要件。',[3,3,2]),O('乡里都说不孝即可列入十恶','舆论替代要件，刑罚被扩大。社会评价不能单独证明法定严重犯罪。',[1,-2,-2]),O('十恶只是道德概念，不影响法律','忽视其法律后果。十恶在律典中具有明确制度地位。',[0,-1,-1])]],
['身份差等','同一伤害行为因亲属尊卑而刑罚不同。你如何解释？','唐律具有鲜明身份与伦理差等，不能等同现代平等原则。',[O('在历史语境中说明名分秩序，再与现代平等适用作区分','解释没有美化差等，也没有以今律古，形成双层评价。',[3,3,2]),O('这就是现代法律面前人人平等','概念相反。身份差等恰恰说明古代与现代平等原则存在结构距离。',[-2,-2,0]),O('古代如此，所以今天也应恢复','从历史事实直接推出现代规范，缺少价值与制度论证。',[1,-2,-1])]],
['官吏受财','县令收财后故意改判，应先区分什么？','唐律区分官吏因公过失与徇私故意，受财枉法具有更强可责性。',[O('查受财、故意及裁判改变之间的证据链','责任判断更准确。身份本身不够，须证明利益与枉法行为关联。',[2,3,2]),O('只要判错就一律按受财枉法','过失与故意被混同，严重罪名的证明要求被降低。',[1,-2,-1]),O('官员有裁量，所以不可能犯罪','把职权当作免责。合法裁量不包括收财后故意歪曲裁判。',[0,-2,-2])]],
['口供矛盾','被告口供与物证冲突，狱吏要求继续拷讯。','传统司法重口供，也存在检验和多证印证；现代更严格禁止刑讯逼供。',[O('暂停强制，复核物证、证人与口供形成条件','误判风险下降。矛盾应通过独立证据解释，而非用更强压力制造一致。',[2,3,3]),O('打到口供与案卷一致','得到表面一致，却无法证明真实性。压力可能只会制造迎合答案。',[1,-3,-3]),O('完全不看口供，只凭直觉','避免刑讯但仍非证据裁判。口供可审查，不能以直觉替代全部证据。',[1,0,0])]],
['类推边界','某行为危害明显，却找不到完全对应条文。','古代存在比附等适用技术；现代罪刑法定对类推入罪限制更严。',[O('先在当时法源中寻找明确依据，并标注与现代罪刑法定的差异','既处理历史问题又守住古今边界。比较法意识提升。',[3,3,2]),O('危害大即可随意比照最重条款','裁量失控。社会危害判断不能自动决定具体刑名。',[1,-2,-2]),O('直接援引现代刑法宣告无罪','保护意识可取，却把现代规范直接溯用于唐代模拟。',[0,1,1])]],
['赎刑适用','有身份者请求以铜赎刑，百姓质疑不公。','古代赎刑有身份、罪类等条件，体现制度差等。',[O('依当时规则判断，同时在复盘中指出身份差等的局限','历史裁判与现代评价被区分，既不伪造史实也不回避问题。',[3,3,2]),O('有钱即可赎，最有效率','财富直接购买免责，忽略赎刑条件并放大不平等。',[1,-2,-2]),O('声称唐代已禁止一切赎刑','史实错误。用理想化叙事遮蔽真实制度。',[-2,0,0])]],
['复核死刑','州府上报死刑案，证据尚有一处矛盾。','传统慎刑包含复核机制；生命刑要求更高审慎。',[O('退回补证并逐项说明疑点，不因限期仓促核准','避免不可逆误判。复核的价值正是在行政压力下保留纠错机会。',[2,3,3]),O('地方已经审过，直接核准','效率提高，关键疑点被带入不可逆判决。层级复核失去实质意义。',[1,-2,-2]),O('所有死刑案一律无条件赦免','避免误杀却取消个案判断。慎刑不等于放弃法律评价。',[1,0,1])]],
['结案评议','如何概括《唐律疏议》的法制史地位？','唐律体系完备、律疏结合，对后世与东亚法制影响深远，同时具有等级身份局限。',[O('肯定体系化与解释技术，同时指出礼制身份差等的历史边界','结论全面。制度成就与价值局限可以同时成立。',[3,3,3]),O('它就是一部现代民法典','法域与时代概念均错置，无法解释刑律中心和身份结构。',[-2,-2,0]),O('古代法律都落后，不值得研究','价值判断替代历史分析，也错失理解制度演进与比较法的机会。',[0,-1,-1])]]]}];

{id:'zichan',era:'春秋郑国 · 公元前536年',title:'子产铸刑书',sub:'成文法公开与礼治秩序',intro:'参与郑国铸刑书争议，判断法律公开、贵族裁量与社会秩序之间的关系。',qs:[
Q('是否公布','郑国准备把刑书铸于鼎上，贵族认为刑不可知才能保持威严。','铸刑书是中国古代成文法公布的重要事件。','支持公布基本规则与刑罚边界','民众获得行为预期，贵族临事裁量受到约束；这正是规则公开的制度意义。','只向乡官秘密传达','执行可能较统一，但普通人仍无法预见后果，公开性目标只完成一半。','继续完全保密','权威暂时保留，任意裁量与同案异罚风险却继续存在。'),
Q('回应叔向','叔向担心民众据法争辩、破坏礼治名分。','反对意见反映春秋礼治秩序面对社会变迁的焦虑。','承认秩序忧虑，但说明公开底线可与教化并存','你回应了反方最强理由，而非简单否定礼；主张因此更有边界。','说时代必然进步，无需解释','方向支持改革，但“必然”不能回答公开规则为何能解决现实问题。','嘲讽叔向守旧','人身评价替代理由，既未解释礼治功能，也无法证明新制度更好。'),
Q('适用对象','贵族要求刑书只约束庶人。','春秋身份秩序鲜明，不能虚构现代平等已经实现。','要求官吏裁判也受公开规则约束','虽非现代平等，却能减少执法者脱离规则的空间，增强法令信用。','先约束庶人，以后再说','改革仍可能运行，但特权例外会削弱公众对规则一致性的信任。','贵族天然在法外','公开刑书沦为单向控制工具，无法限制掌权者的任意解释。'),
Q('旧案处理','刑书公布后，有人要求按新法追罚公布前行为。','规则公开与时间效力关系到行为可预期性。','原则上不以新公布规则追罚此前未知行为','避免事后改变标准，让公布真正服务于事前行为引导。','由执政者逐案决定','保留灵活性，却使时间效力取决于个人偏好，可预期性不足。','一律追溯从重','百姓不可能按尚未公布的规则行动，追溯重罚破坏法令信用。'),
Q('条文含混','刑书中的“扰乱”含义过宽，地方解释不一。','成文化不等于自动消除裁量。','发布解释标准并汇总典型案件','同类行为获得较稳定尺度，也为后续修订提供材料。','让各地按风俗理解','兼顾地方差异，但同案差异扩大，中央公布规则被碎片化。','谁被指控就算扰乱','含混词变成无限权力入口，成文法只剩形式。'),
Q('民众争讼','公布后诉讼增多，贵族称改革失败。','诉讼上升可能是既有纠纷获得表达渠道。','区分恶意缠讼与正常权利主张','你没有把“案件变多”直接等同秩序恶化，能进一步评估制度真实效果。','立即减少受理数量','短期数据好看，但可能把正常争议重新压回非正式冲突。','废除刑书恢复秘密裁判','用关闭渠道消灭统计，问题本身并未消失。'),
Q('官吏培训','基层官吏读不懂新刑书。','法律文本需要执行能力支撑。','编制释义、培训并设置疑难请示','降低误读，让统一文本转化为较一致的实际裁判。','要求官吏自行揣摩','节省成本，却会制造不同解释，公开文本难以统一实践。','读错者全部重罚','恐惧不能补足知识，官吏反而可能隐瞒疑难和错误。'),
Q('修法机制','社会关系变化，旧条文出现漏洞。','成文法需要稳定，也需要合法修订。','建立公开修订程序并说明理由','规则变化保持可追踪，稳定与适应性得到平衡。','随时口头补充','反应快，但口头命令重新引入不可知和不可验证。','永远不得修改','形式稳定，却会让规则与社会现实脱节。'),
Q('古今比较','同学说铸刑书就是现代法治诞生。','早期成文法公开与现代法治不能简单等同。','称其为公开化探索，并说明身份与权利结构差异','既提炼法理价值，又保留历史限度。','直接称为现代宪政','使用熟悉概念，却超出史实可支持范围。','认为与今天毫无联系','避免错置，却放弃了从公开性和裁量约束中提炼启示。'),
Q('最终陈词','如何概括铸刑书的历史意义？','结论应兼顾制度转向与争议。','它推动规范公开并挑战秘密裁量，但仍处于礼法秩序转型之中','结论完整解释了“进步何在”和“边界何在”。','子产是贤人，所以改革正确','人物评价不能替代制度因果分析。','公布法律必然摧毁秩序','把反方忧虑当作必然结果，缺少实践证据。')]},
{id:'qin',era:'秦 · 睡虎地秦简',title:'云梦县廷',sub:'秦简中的基层治理',intro:'依据秦简所见制度，处理户籍、徭役、官吏责任、文书与现场勘验。',qs:[
Q('户籍脱漏','乡里户籍与实有人口不符，县令要求立刻重罚里典。','秦简反映细密的户籍、行政与官吏责任制度。','先核对迁徙文书、登记期限与里典故意过失','责任与证据对应，避免把制度缺口全部推给末端官吏。','先罚后查以示整肃','形成压力，但若事实后来相反，行政信用和记录真实性都会受损。','全乡连坐不问原因','扩大责任最省事，却混淆个人行为、法定义务与无过居民。'),
Q('徭役冲突','农忙时征发徭役，田地可能失收。','秦国家动员能力强，徭役安排也影响生产基础。','核对法定名额与期限，分批征发并留存文书','既完成公共任务，也减少超额征发破坏农业。','由豪强自行决定谁服役','执行方便，却可能把负担转嫁给弱户。','全数提前加征','短期工程加快，长期粮产和民众承受力受损。'),
Q('官物损坏','仓吏报告粮袋受潮，却无交接记录。','秦律重视官物管理和官吏责任。','勘验损耗原因并核对交接、封识与保管义务','能区分自然损耗、过失和侵占，责任不再只靠猜测。','仓吏负责所以必为盗','身份与结果不能直接证明故意侵占。','不查小额损失','一次省事可能形成记录空洞，长期积累更大风险。'),
Q('现场勘验','盗案现场有足迹、破锁和邻人证言。','秦简中的封诊式体现对勘验记录的重视。','分别记录位置、尺寸、时间并相互印证','证据保留原貌，后续复核能检查推断是否可靠。','先确定嫌疑人再挑证据','证据会被选择性解释，调查从求真变成确认偏见。','只听最年长邻人','年龄可能带来经验，却不能替代证言来源与物证核验。'),
Q('文书迟延','驿传文书晚到三日，承办吏称道路被洪水阻断。','行政责任判断需区分不可抗力、过失与故意。','核查天气、驿程和交接时间后再定责','事实链能判断迟延是否可归责，避免机械处罚。','凡迟到一律同罚','标准简单，但不可控制原因与懈怠被混为一谈。','只要辩称洪水就免责','给出理由不等于证明理由，缺乏核查会鼓励虚假抗辩。'),
Q('上级口令','郡吏口头要求修改已封存数据。','文书与层级程序限制行政信息被随意改变。','要求正式文书并保留修改前后记录','上级命令可验证，数据变更也能追责。','服从口令不留痕','短期顺从，日后无法判断是谁、为何改变记录。','当众销毁全部档案','避免被改，却同时破坏治理和证据基础。'),
Q('告发奖励','奖励告发后，私人仇怨包装成案件。','信息激励需要防范诬告与操纵。','对告发内容独立核验，故意虚构者承担责任','真实线索被保留，报复性告发的收益下降。','有告发就立即定罪','告发者掌握了事实上的裁判权，错误与报复会扩散。','取消所有告发渠道','减少诬告，也会失去难以由官府主动发现的线索。'),
Q('官吏考课','上级只按结案数量评价县吏。','单一指标容易扭曲行为。','加入错案、期限、文书完整与民生影响指标','官吏不再只追求数量，质量和责任进入考核。','继续只看数量','报表改善，仓促定案和拆分案件可能增加。','不设任何考核','避免指标异化，却也失去监督懈怠的工具。'),
Q('秦法评价','有人因秦简细密便称秦已实现现代依法行政。','行政规则化与现代权利约束并非同一概念。','肯定文书化治理，同时说明高强度控制和权利结构差异','评价同时解释技术成就与制度边界。','直接等同现代法治政府','把行政效率误作现代权利法治。','只说秦法残酷，简牍无研究价值','遗漏基层行政、证据和文书制度的重要材料。'),
Q('县廷总结','如何概括秦简呈现的法律世界？','出土简牍让制度史从抽象法典走向日常治理。','它展示细密行政与责任技术，也揭示高度动员和严密控制','结论能把微观文书与国家治理结构连接起来。','它只是几件古代公文','材料被孤立，无法解释制度网络。','它证明秦政所有做法都有效','有规则不等于所有规则都正当或成功。')]},
{id:'song',era:'南宋 · 提刑司',title:'雨夜疑狱',sub:'检验、翻异与慎刑',intro:'担任提刑官，复核一宗证据矛盾的命案，体验传统司法中的检验与纠错。',qs:[
Q('接收案卷','县衙以一纸认罪口供报结命案。','宋代司法有复核、翻异与检验实践。','先审查口供形成过程及其与物证是否相合','复核找到入口，认罪不再自动等于事实。','口供完整便直接核准','效率高，却忽略口供可能受压力或诱导。','因同情被告直接释放','避免仓促定罪，但同样绕过证据审查。'),
Q('尸体检验','尸表记载“刃伤”，衣物却无相应破口。','检验记录应与现场、衣物和致伤工具相互印证。','要求复验伤口、衣物和可能凶器','矛盾得到针对性检验，能判断初验是否错误。','以尸表为官文书不可质疑','文书权威替代事实，初验错误无法纠正。','认定衣物必被更换','提出可能性却没有证据，推测不能直接成为结论。'),
Q('证人翻供','唯一证人称此前受里正指使。','翻供既可能揭露胁迫，也可能是新的谎言。','分别核对两次证言的细节、动机与外部证据','不盲信任何一次陈述，可信度由印证决定。','翻供就证明第一次必假','新陈述仍需检验，变化本身不能证明真假。','坚持初供永远有效','忽视证言形成条件，可能维护被操纵的版本。'),
Q('刑讯压力','属吏建议拷讯被告尽快结案。','传统司法存在刑讯风险；现代明确禁止刑讯逼供。','停止施压，转向独立证据和现场重建','口供污染风险下降，调查重新围绕可验证事实。','轻打几下不算刑讯','压力程度难以控制，所得陈述仍可能迎合审讯者。','打到细节一致','一致可能来自提示和恐惧，不等于真实记忆。'),
Q('死亡时间','更鼓簿、饭食消化与证人时间互相冲突。','时间线是检验证据链的重要工具。','列出时间区间并标明每项证据误差','不确定性被诚实呈现，矛盾可逐项解释。','挑最支持原判的时间','确认偏见让其余证据被人为排除。','取三个时间的平均数','数学平均没有事实依据，不同证据不能机械相加。'),
Q('官员干预','知县暗示维持原判可保地方考成。','复核制度要抵抗行政绩效对个案的扭曲。','记录干预并依据证据独立复核','考成压力被隔离，复核保有纠错功能。','为顾全官场维持原判','个人关系和绩效取代事实判断。','公开羞辱知县后不再查案','揭露干预却放弃案件本身，受害者与被告都未获答案。'),
Q('无罪疑点','证据不足以锁定被告，但真凶未明。','慎刑与继续侦查可以并存。','不维持有罪结论，同时列明待查线索','避免枉断，也没有把疑案当作已解决。','先定罪以后再查','不可逆惩罚被建立在尚未闭合的证据上。','宣布案件从未发生','无罪疑点不等于否认死亡事实和追查义务。'),
Q('检验知识','学生说宋代检验等同现代法医学。','传统检验有重要经验，也受时代知识与程序限制。','肯定经验积累，同时区分现代科学标准','比较既不贬低古人，也不夸大同一性。','完全等同现代DNA鉴定','技术原理和证明能力被严重夸大。','认为古代检验毫无价值','忽略检验文书和经验对减少错案的作用。'),
Q('责任追究','初审官因疏忽造成错判，应如何处理？','纠错既需个案改判，也需区分故意枉法与一般过失。','查明过失程度、干预因素并修正规程','个人责任与制度预防同时推进。','凡错判一律最重处罚','会促使官员隐瞒错误，也混淆故意和能力不足。','改判即可，不追原因','个案被纠正，相同流程缺陷仍会复制。'),
Q('复核结论','如何总结疑狱复核的价值？','复核不是重复盖章，而是独立发现矛盾。','以证据印证、程序记录和慎用不可逆刑罚构成纠错链','结论解释了复核为什么能真正减少错案。','上级官阶高所以判断必然正确','权威本身不能保证事实准确。','只要拖得足够久就算慎刑','时间延长若无针对性核查，只是迟延正义。')]},
{id:'ming',era:'明 · 洪武法制',title:'洪武新法',sub:'律典、诰令与重典治吏',intro:'在《大明律》与《大诰》并行的背景下，处理惩贪、法源冲突和基层告讦。',qs:[
Q('法源冲突','《大明律》已有规定，新颁诰令要求加重处罚。','明初律典与特别诰令共同影响实践。','核对适用时间、对象与正式效力并记录依据','裁判理由可追踪，避免法源叠加成为任意从重。','一律挑最重者适用','简单强硬，却使刑罚边界随文件叠加无限上升。','只看个人喜好选择','法源问题被变成私人裁量。'),
Q('惩贪证据','百姓控告县吏受赃，只有传闻没有账册。','重典治吏仍需事实基础。','保护举报线索并追查账册、财物流向和经手人','既不压制举报，也不让传闻直接完成定罪。','举报官吏就先处重刑','政治目标替代证明，诬告和错案风险上升。','官吏身份体面，不予调查','身份成为屏障，惩贪制度失去可信度。'),
Q('越诉告官','百姓越级赴京告发地方官。','明初鼓励民众在特定情形下告奸，也可能冲击常规层级。','审查越诉原因并防止地方截访报复','真实控告获得渠道，同时保留对虚假内容的核验。','一概视为扰乱秩序','地方官可通过控制渠道掩盖自身问题。','越级者所言一律为真','越级困难能说明风险，却不能自动证明全部事实。'),
Q('酷刑取供','办案者称重刑治吏必须配合严讯。','政治高压容易把目标正当性扩张为手段无限。','把惩贪目标与证据方法分开，禁止用供词替代财证','案件更可能经受复核，惩贪不再依赖制造口供。','贪官可恶，手段不限','先定性后取证，容易把无辜者也纳入目标。','完全停止查贪','避免酷刑却放弃公共责任，问题在手段而非目标本身。'),
Q('株连家属','官员贪赃，办案者要求家属一律同罪。','责任扩大需区分参与、受益、隐匿与单纯亲属身份。','逐人查明是否参与转移、隐匿或共同受益','真正共犯被追究，无过亲属不因身份自动受罚。','全部连坐','威慑增强，但个人责任被亲属身份替代。','家属永远不可能参与','反对株连正确，却不能预设家属一定无行为责任。'),
Q('律典统一','地方沿用旧习，与《大明律》条文冲突。','统一律典旨在形成全国规范框架。','以正式律文为基准并调查地方习惯的合理调整空间','统一性得到维护，实际执行困难也被纳入修正。','地方官想怎么判就怎么判','全国律典失去统一尺度。','不问现实机械照抄','形式统一，但可能忽视条文适用所需事实条件。'),
Q('皇权与法律','有人称皇帝发布命令，因此任何临时口谕都是法律。','传统皇权法制中诏令重要，但具体效力仍需历史辨析。','区分正式诏令、律典与个别口头指示的形成和适用','避免把复杂法源结构简化为一句“君意即法”。','全部等同且可随时追溯','规则时间与形式边界消失，执行者无从预期。','皇帝命令在明代毫无法律作用','矫枉过正，不符合皇权法制实际。'),
Q('数字考核','朝廷按查获贪官数量考核监察官。','单一反腐指标可能激励扩大案件。','同时考察证据质量、改判率与追回财物真实性','监察者不易靠制造数量邀功。','数量越多政绩越好','指标会推动把正常行政错误包装成贪腐。','不监督监察官','监督者失去约束，权力风险转移而非消失。'),
Q('历史评价','学生把《大诰》称作现代反腐特别法。','名称类比不能掩盖权力结构和程序差异。','比较惩贪目标，同时说明重刑、告讦和皇权背景','类比受到边界控制，历史特征没有被抹平。','完全等同现代特别法','现代程序和权利保障被错误投射。','只称暴政材料无需细读','价值批判替代制度分析，无法解释其运行方式。'),
Q('结案总结','如何评价明初重典治吏？','高压惩贪有政治动员力，也伴随刑罚扩张和程序风险。','区分治理目标、实际成效与手段边界','结论能够解释为何“反腐正确”不等于“所有手段正确”。','只要惩贪就都值得肯定','目标正当性吞没手段审查。','因手段严酷便否认一切制度建设','忽略律典统一和官僚治理的历史面向。')]},
{id:'qing',era:'清 · 秋审制度',title:'秋审大典',sub:'死刑复核与情实缓决',intro:'进入清代刑部秋审，区分情实、缓决、可矜与留养承祀，处理生命刑复核。',qs:[
Q('案卷入审','地方上报斩监候案件，刑部首先做什么？','秋审对监候死刑案件进行集中复核分类。','核对罪名、证据、程序和地方题本是否一致','复核从事实与法律双重审查开始，不是简单重读结论。','只看知府官阶决定可信度','官阶不能替代案卷证据。','所有案件直接执行','监候与秋审制度的复核功能被取消。'),
Q('情实判断','故意杀人证据完整且情节严重。','“情实”通常意味着情罪属实、应予执行。','逐项确认故意、因果和无重大疑点后再拟情实','分类建立在完整证据和严重情节上，生命刑决定较可解释。','只因造成死亡就情实','结果相同不代表主观和情节相同。','因家属求情自动缓决','同情可提供情节线索，却不能单独推翻事实和规范。'),
Q('缓决依据','案情属实，但情节与执行必要性尚可斟酌。','缓决体现将执行推迟、继续复核的慎刑机制。','列明可缓因素和待核疑点后拟缓决','延期具有明确理由，后续复核知道要解决什么。','所有人轮流缓决','避免立即执行，却使分类失去个案依据。','为提高效率全部情实','行政效率不能压倒生命刑审慎。'),
Q('可矜情节','被告因长期受虐激愤伤人，事实无疑。','可矜关注特定可悯情节，但不等于现代正当防卫规则。','审查受虐事实、即时危险与行为限度后评估可矜','情节被证据化，避免仅凭故事感动或排斥。','听闻可怜便免除一切责任','同情替代要件，事实严重性未被处理。','既已杀人便无任何情节可谈','抹去责任程度差异，分类制度失去意义。'),
Q('留养承祀','死刑犯是家中独子，祖父母年老无人奉养。','留养承祀体现传统家族伦理对刑罚执行的影响，并有适用条件。','核查亲属结构、罪类与制度条件再决定','避免把伦理理由无限扩大，也不忽视当时规则。','独子一律免死','亲属身份自动覆盖罪责，超出制度边界。','认为赡养与刑罚永远无关','以现代直觉抹去清代制度的伦理结构。'),
Q('供证冲突','口供认罪，现场痕迹却支持另一时间线。','死刑复核应特别重视无法解释的证据矛盾。','退回补查并标明冲突，不以认罪压过物证','不可逆决定被暂停，调查获得明确方向。','口供最重要，维持原判','认罪可能受压力或误导，不能自动解释客观冲突。','物证看不懂就忽略','无法理解的证据正应复核，而非删除。'),
Q('名单压力','秋审案件众多，上级要求按比例减少缓决。','分类应基于个案，而非预设统计比例。','拒绝固定比例，按案卷事实逐案说明','统计目标不能先决定谁被执行。','按比例随机挑选情实','生命刑被变成抽签，个案理由完全消失。','全部缓决以规避责任','看似慎刑，实为不作判断，也可能拖延所有案件。'),
Q('皇帝勾决','最终执行仍涉及最高权力裁决。','秋审体现官僚复核与皇权最终裁断结合。','如实呈报分类依据与疑点，不迎合预判','上层决定获得较完整信息，复核官保留专业责任。','揣测圣意后修改案情','信息被扭曲，最终裁断失去事实基础。','隐瞒全部疑点以求整齐','形式一致是以牺牲纠错为代价。'),
Q('古今比较','有人把秋审直接称为现代死刑复核程序。','两者都有慎重审查面向，但权力结构和权利保障不同。','比较复核功能，同时说明皇权、身份伦理和现代程序差异','相似性与差异同时呈现，避免简单等同。','两者完全一样','制度目的局部相似被夸大为整体相同。','两者毫无可比性','拒绝比较会错失理解慎刑与复核演进的机会。'),
Q('秋审结论','如何评价秋审制度？','它是传统慎刑的重要制度化形式，也受时代结构限制。','肯定集中复核和分类纠错，同时指出皇权与差等伦理边界','结论既解释制度价值，也保留现代批判视角。','有秋审就不会发生错案','任何复核都不能保证零错误，关键在信息和独立性。','它只是拖延执行，没有意义','忽略延期、分类和再审查对不可逆刑罚的约束作用。')]}
);
const backgrounds={
tiying:'<p><b>时代环境：</b>西汉建立后承袭秦代不少法律制度，同时又以“约法省刑”和休养生息回应秦政严酷的历史记忆。公元前167年，齐太仓令淳于意获罪，被押往长安受刑。</p><p><b>事件起点：</b>幼女缇萦随父入京，上书汉文帝，提出身体一旦残毁，受刑者即使希望改过也没有道路。文帝因此下诏废除肉刑，但替代的笞刑在执行中又造成伤亡。</p><p><b>你的身份：</b>廷尉属官。你不仅要回答“要不要废”，还要处理替代刑、罪刑相当、行刑程序和刑后复归。</p>',
shangyang:'<p><b>时代环境：</b>战国诸侯竞争加剧，秦孝公希望通过变法摆脱旧贵族束缚，建立能够征税、征兵和统一动员的国家机器。商鞅先后推行县制、军功爵、什伍连坐及奖励耕战等措施。</p><p><b>制度冲突：</b>公开法令与统一奖罚提升了国家能力，也伴随重刑、告奸和严密社会控制。强国成效不能自动回答所有手段是否合理。</p><p><b>你的身份：</b>秦国法吏。你要在法令信用、贵族特权、军功核验、连坐边界与执行一致性之间作出十次决定。</p>',
tanglv:'<p><b>时代环境：</b>唐代在前代律令基础上形成较成熟的律、令、格、式体系。《唐律疏议》以律文与疏议结合，对后世中国及东亚法制产生深远影响。</p><p><b>制度特征：</b>礼法结合深入亲属、身份和名分秩序；同居相隐、十恶、官吏犯罪、赎刑与死刑复核共同构成复杂规范网络。它体系精密，却并非现代平等权利法治。</p><p><b>你的身份：</b>大理寺评事。你将处理亲属藏匿、枉法受财、证据冲突、比附边界和死刑复核。</p>',
zichan:'<p><b>时代环境：</b>春秋后期，宗法等级与礼治秩序受到社会流动、土地关系和政治竞争冲击。郑国执政子产进行多项改革，并于公元前536年把刑书铸于鼎上。</p><p><b>争议核心：</b>晋国叔向来信批评，担忧百姓知法后争于条文、破坏贵贱名分；支持者则认为公开规则能让人预知禁令，并限制贵族临事裁量。</p><p><b>你的身份：</b>郑国学宫法议官。你要设计公布、解释、适用和修订机制，并区分早期成文法公开与现代法治。</p>',
qin:'<p><b>材料背景：</b>1975年湖北云梦睡虎地出土秦简，内容涉及法律答问、封诊式、行政文书和为吏之道，使我们看到秦法不只是抽象“严刑”，也深入户籍、仓储、徭役和现场勘验。</p><p><b>治理结构：</b>秦国依靠县廷、乡里、文书和官吏责任建立高强度动员体系。细密规则提升行政能力，也可能带来连坐、过度考核与基层压力。</p><p><b>你的身份：</b>云梦县廷令史。你将在十件日常政务中判断事实、区分故意过失，并留下可复核的文书记录。</p>',
song:'<p><b>时代环境：</b>宋代司法设置州县审判、提刑司监察复核等层级，重视案卷、检验与翻异。传统司法仍存在刑讯与口供中心风险，但也发展出针对尸伤、现场和时间线的检验经验。</p><p><b>案件背景：</b>一宗雨夜命案仅凭认罪口供迅速报结，尸表、衣物、证人和更鼓时间却彼此冲突。地方官担心改判影响考成。</p><p><b>你的身份：</b>巡按本路的提刑官。你要在十轮内重建证据链，判断是否维持原判，并说明传统慎刑与现代证据规则的差异。</p>',
ming:'<p><b>时代环境：</b>明初重建全国统治秩序，《大明律》逐步定型，明太祖又以《大诰》等形式强化惩贪和政治教化。统一律典与高压特别措施共同塑造洪武法制。</p><p><b>制度冲突：</b>重典治吏回应官僚腐败，却可能导致法源叠加、告讦扩张、刑讯和株连。反腐目标的正当性不能自动证明所有手段都有边界。</p><p><b>你的身份：</b>刑部审刑官。你将处理受赃证据、越诉、诰令适用、家属责任和监察考核。</p>',
qing:'<p><b>时代环境：</b>清代对斩监候、绞监候案件实行秋审，刑部会同有关机构集中复核，并按情实、缓决、可矜、留养承祀等类别提出处理意见，最终还涉及最高权力裁断。</p><p><b>制度意义：</b>秋审把传统“慎刑”转化为周期性复核和分类机制，为不可逆的生命刑增加纠错机会；同时又深受皇权结构、家族伦理和身份制度影响。</p><p><b>你的身份：</b>刑部秋审处主事。面对数量庞大的生命刑案卷，你必须抵抗比例压力，逐案解释证据、情节和分类理由。</p>'};
const caseUI={
tiying:{place:'长安·廷尉署',people:['缇萦｜上书人','淳于意｜受刑者','廷尉正｜旧刑支持者','汉文帝｜最终裁决者'],evidence:['缇萦上书','旧刑案册','替代刑草案','地方伤亡奏报']},
shangyang:{place:'栎阳·变法官署',people:['商鞅｜变法主持','秦孝公｜支持者','旧贵族｜反对方','县令｜执行者'],evidence:['新法木牍','军功簿','连坐名册','告奸复核册']},
tanglv:{place:'长安·大理寺',people:['大理寺卿｜主审','被告之兄｜隐匿者','县令｜涉嫌枉法','御史｜复核者'],evidence:['唐律疏议条文','亲属谱牒','受财账册','尸伤检验状']},
zichan:{place:'郑国·执政之庭',people:['子产｜改革者','叔向｜质疑者','郑国贵族｜利益方','乡官｜执行者'],evidence:['铸鼎刑书','叔向来书','地方判牍','修法议案']},
qin:{place:'云梦·县廷',people:['县令｜决策者','令史｜玩家','里典｜基层官','仓吏｜被调查者'],evidence:['户籍简','封诊式','仓储交接簿','驿传文书']},
song:{place:'南宋·提刑司',people:['提刑官｜玩家','被告｜翻供者','仵作｜检验人','知县｜原审官'],evidence:['认罪供状','尸表','更鼓簿','现场衣物']},
ming:{place:'洪武·刑部',people:['审刑官｜玩家','县吏｜被告发者','越诉百姓｜告发人','监察官｜办案者'],evidence:['大明律条文','大诰诰令','赃款账册','越诉文书']},
qing:{place:'京师·秋审处',people:['刑部主事｜玩家','地方督抚｜原报者','死刑犯｜被复核者','堂官｜分类者'],evidence:['地方题本','口供卷宗','现场物证','秋审分类单']}}
let mode='home',ci=0,qi=0,score={史实:0,法理:0,表达:0},feedback=null,history=[];
const app=document.getElementById('app');
function home(){mode='home';render()}
function start(i){ci=i;qi=0;score={史实:0,法理:0,表达:0};feedback=null;history=[];mode='brief';render();scrollTo(0,0)}
function begin(){mode='play';render();scrollTo(0,0)}
function choose(i){if(feedback)return;let o=cases[ci].qs[qi][3][i],impact=o.d.reduce((a,b)=>a+b,0);Object.keys(score).forEach((k,n)=>score[k]+=o.d[n]);history.push({q:cases[ci].qs[qi][0],choice:o.t,result:o.r,impact,route:i===0?'制度推进':i===1?'折中应对':'风险升级'});feedback={...o,index:i,impact};render();scrollTo({top:0,behavior:'smooth'})}
function next(){feedback=null;if(qi===9){mode='result'}else qi++;render();scrollTo({top:0,behavior:'smooth'})}
function grade(){let t=Object.values(score).reduce((a,b)=>a+b,0);return t>=70?'S':t>=52?'A':t>=32?'B':'C'}
function situation(){let t=history.reduce((a,b)=>a+b.impact,0);return t>=qi*4?'此前的稳健处理提高了各方信任，后续争议转向制度细节。':t>=0?'此前选择带来有限进展，但反对者仍抓住执行漏洞施压。':'此前的高风险决定使矛盾升级，下一事件将在更低信任和更强压力下展开。'}
function dossier(c){let u=caseUI[c.id],open=Math.min(4,Math.floor(qi/2)+1);return `<aside class="dossier"><span class="chapter">${u.place}</span><h3>案卷 · ${c.title}</h3><div class="section-label">相关人员</div><div class="people">${u.people.map(x=>{let a=x.split('｜');return `<div class="person"><b>${a[0]}</b><span>${a[1]}</span></div>`}).join('')}</div><div class="section-label">已收集证据 ${open}/4</div><div class="evidence-list">${u.evidence.map((x,i)=>`<div class="evidence-item ${i>=open?'locked':''}"><b>${i<open?'卷证':'尚未解锁'}</b>${i<open?x:'推进剧情后取得'}</div>`).join('')}</div><div class="section-label">判决轨迹 ${history.length}/10</div><ol class="judgment-list">${history.length?history.map(x=>`<li>${x.q} · ${x.route}</li>`).join(''):'<li>尚未作出决定</li>'}</ol></aside>`}
function render(){if(mode==='home'){app.innerHTML=`<header class="top"><div class="seal">律</div><p class="eyebrow">中国法制史 · 互动案例库</p><h1>律令千年</h1><p class="lead">每案十轮决策。每次选择都会先发生一个小结果，并解释它为什么发生。</p></header><section class="case-grid">${cases.map((c,i)=>`<article class="case"><i>${c.era}</i><h2>${c.title}</h2><b>${c.sub}</b><p>${c.intro}</p><span class="meta">10轮决策 · 30个选项 · 即时因果反馈</span><button class="primary" onclick="start(${i})">进入案例</button></article>`).join('')}</section><a class="legacy" href="legacy-zheyu.html">特别篇：南宋雨夜审案（旧版）</a><footer>教学化历史模拟 · 用于法制史案例分析，不等同于真实古代司法程序</footer>`;return}
let c=cases[ci];if(mode==='brief'){app.innerHTML=`<div class="toolbar"><button class="back" onclick="home()">← 案例库</button><span class="eyebrow">案前卷宗</span></div><section class="panel"><span class="chapter">${c.era}</span><h2>${c.title}：${c.sub}</h2><div class="context">${backgrounds[c.id]}</div><div class="knowledge"><b>学习任务：</b>完成10幕关联事件。每次决定都会触发剧情结果，并成为下一幕的前情条件。</div><button class="primary" onclick="begin()">读毕卷宗，开始推演</button></section>`;return}if(mode==='result'){let g=grade(),ending=g==='S'?'你的连续决策建立了可信的制度方案，各方最终接受结论。':g==='A'?'事件得到控制，但部分折中方案留下后续争议。':g==='B'?'案件勉强收束，前期选择造成的制度漏洞仍待修补。':'多次高风险决定累积为危机，结案并未真正解决争议。';app.innerHTML=`<div class="toolbar"><button class="back" onclick="home()">← 案例库</button><span class="eyebrow">${c.title} · 路线结局</span></div><div class="overlay"><section class="modal-card result"><div class="modal-icon">📜</div><p class="eyebrow">最终判牍 · ${g}级结局</p><div class="grade">${g}</div><h2>${g==='S'?'制度改革者':g==='A'?'稳健法吏':g==='B'?'未竟之局':'危机升级'}</h2><p class="context">${ending}</p><div class="cards">${Object.entries(score).map(([k,v])=>`<div>${k}<b>${v}</b></div>`).join('')}</div><div class="review"><b>你的十幕事件链</b><ol class="timeline">${history.map(x=>`<li><span class="route">${x.route}</span><br><b>${x.q}：</b>${x.choice}<br><small>→ ${x.result}</small></li>`).join('')}</ol></div><button class="primary" onclick="start(${ci})">重新开始</button> <button class="back" onclick="home()">返回案件列表</button></section></div>`;return}
let q=c.qs[qi],pct=(qi+(feedback?1:0))*10;app.innerHTML=`<div class="toolbar"><button class="back" onclick="home()">← 案例库</button><div class="score">${Object.entries(score).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join('')}</div></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div>${feedback?feedbackView(c,q):questionView(c,q)}`}
function questionView(c,q){let prev=history.at(-1);return `<div class="case-layout">${dossier(c)}<section class="panel"><span class="chapter">${c.title} · 第 ${qi+1}/10 幕</span><h2>${q[0]}</h2>${prev?`<div class="continuity"><b>前情续接 · ${prev.route}</b><br>${prev.result}<br><small>${situation()}</small></div>`:''}<div class="event-bg"><b>案情描述</b><br>${q[1]}</div><div class="knowledge"><b>卷宗提示：</b>${q[2]}</div><div class="section-label">拟定判令</div><div class="options">${q[3].map((o,i)=>`<button class="option" onclick="choose(${i})"><em>${String.fromCharCode(65+i)}</em>${o.t}<small>将触发：${i===0?'制度推进路线':i===1?'有限折中路线':'矛盾升级路线'}</small></button>`).join('')}</div></section></div>`}
function feedbackView(c,q){let sum=feedback.impact,cl=sum>=6?'':sum>=1?'mid':'bad';return `${questionView(c,q)}<div class="overlay"><section class="modal-card feedback ${cl}"><div class="modal-icon">${sum>=6?'📜':sum>=1?'⚖️':'⛓️'}</div><span class="chapter">世界推演完成 · 第 ${qi+1} 幕</span><h2>${sum>=6?'新证据与秩序形成':sum>=1?'局势暂稳，隐患犹存':'判令引发连锁危机'}</h2><div class="world-state">已根据你的判令重算人物态度、证据可信度与后续事件</div><span class="route">${feedback.index===0?'制度推进':feedback.index===1?'折中应对':'风险升级'}</span><p><b>你的决定：</b>${feedback.t}</p><div class="reason"><b>推演结果</b><br>${feedback.r}<hr><b>为什么会得出这个结果？</b><br>该决定改变了规则公开程度、责任边界或证据可靠性，所以这一后果会被写入案卷，并成为下一幕的前情条件。</div><div class="delta">${Object.keys(score).map((k,i)=>`<span class="${feedback.d[i]<0?'minus':''}">${k} ${feedback.d[i]>=0?'+':''}${feedback.d[i]}</span>`).join('')}</div><div class="knowledge"><b>本幕法制史要点：</b>${q[2]}</div><button class="primary" onclick="next()">${qi===9?'生成最终判牍':'确认结果，继续推演'}</button></section></div>`}
render();
</script></body></html>
