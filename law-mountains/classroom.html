<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>律脉千秋·课堂抉择</title>
<style>
:root{--paper:#f4e8cd;--ink:#251b13;--red:#963f32;--gold:#d6b674;--dark:#17110e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei",sans-serif;background:#0d0b09;color:var(--paper)}button,a{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:linear-gradient(125deg,#17110ef2,#302219d9),url("./assets/han-palace-gate.png") center/cover fixed}.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#130f0de8;border-bottom:2px solid #85512d;padding:12px clamp(15px,3vw,38px)}.brand{font:bold 25px KaiTi,serif;color:#ead6a8}.tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.tools button,.link{background:#31251b;color:#f6e4bf;border:1px solid #9c7b4e;border-radius:6px;padding:9px 12px;text-decoration:none}.tools button:hover,.link:hover{background:#604333}.screen{width:min(1100px,calc(100% - 28px));margin:24px auto;padding:clamp(20px,4vw,42px);background:#241a15ed;border:1px solid #9b784a;box-shadow:0 22px 60px #0008;border-radius:12px}.eyebrow{color:#d5b475;font-weight:800;letter-spacing:.14em}.screen h1{font:900 clamp(42px,5vw,66px)/1.15 KaiTi,serif;margin:8px 0 18px;color:#f4dfa9}.screen h2{font:900 clamp(36px,4vw,50px)/1.2 KaiTi,serif;margin:8px 0 18px;color:#f4dfa9}.lead,.body{font-size:clamp(20px,2.2vw,28px);line-height:1.65;white-space:pre-line}.small{font-size:17px;line-height:1.7;color:#d3c1a7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:24px 0}.card,.option{background:#edddba;color:var(--ink);border:2px solid #b28d51;border-radius:9px;padding:18px;text-align:left;box-shadow:0 5px 0 #61442e}.card h3{font:900 30px KaiTi,serif;color:#813328;margin:0 0 10px}.card p{font-size:18px;line-height:1.55}.option{width:100%;display:block;font-size:clamp(22px,2.5vw,30px);line-height:1.45;margin:12px 0}.option small{display:block;font-size:18px;margin-top:8px;color:#6e5541}.option.selected{background:#d9e3d8;border-color:#5c8d77}.option:disabled{cursor:default;opacity:.78}.primary{background:#973e32;color:white;border:1px solid #dcaa71;border-radius:7px;font-size:23px;font-weight:800;padding:12px 21px;box-shadow:0 4px 0 #522018}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.feedback{margin:20px 0;padding:18px;background:#26453d;border-left:5px solid #a3ceaf;font-size:22px;line-height:1.65;white-space:pre-line}.note{margin:18px 0;padding:16px;background:#57402a;border-left:5px solid var(--gold);font-size:19px;line-height:1.55}.question{font-size:22px;color:#e7c98a;border-top:1px solid #725637;padding-top:15px;margin-top:23px}.chip{display:inline-block;background:#4b3425;padding:7px 12px;margin:5px;border-radius:5px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.slot{background:#3b2c22;border:1px solid #9b784a;border-radius:7px;padding:12px}.slot h3{font-size:23px;color:#e6c78d;margin:0 0 8px}.pill{display:block;width:100%;text-align:left;border:1px solid #9b784a;border-radius:5px;background:#e9d7b2;color:#2d2118;font-size:19px;padding:10px;margin:7px 0}.pill.on{background:#b7d4c2}.muted{opacity:.65}.progress{color:#d5b475;font-size:16px}.pause{position:fixed;inset:0;z-index:10;background:#090705eb;display:none;place-items:center;padding:20px}.pause.open{display:grid}.pause>div{max-width:700px;background:#30251c;border:1px solid #b68b55;padding:30px;border-radius:10px}.pause h2{font:900 45px KaiTi,serif}.pause p{font-size:25px;line-height:1.6}.animate{animation:appear .35s ease-out}@keyframes appear{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:700px){.bar{position:relative;align-items:flex-start;flex-direction:column}.tools{justify-content:flex-start}.screen{margin:12px auto}.option{font-size:22px}.body,.lead{font-size:21px}}
</style>
</head>
<body><div class="app"><header class="bar"><div class="brand">律脉千秋 · 课堂抉择</div><nav class="tools"><button onclick="togglePause()">暂停讨论</button><button onclick="skipAnimation()">跳过动画</button><button onclick="restart()">重新开始</button><button onclick="home()">返回首页</button><a class="link" href="./index.html">八案录</a></nav></header><main id="screen" class="screen"></main></div><div id="pause" class="pause"><div><h2>暂停讨论</h2><p>你依据的是什么事实？<br>这个选择会给谁带来代价？<br>还有什么信息没有查清？</p><button class="primary" onclick="togglePause()">继续</button></div></div>
<script>
const el=document.getElementById('screen');
const state={scene:null,step:0,first:null,initial:null,focus:[],clauses:[],sort:{},invest:null,timeline:[],opinion:{},answer:null};
const clauses=['运粮须按期抵达，延误者须说明缘由。','遇暴雨、山崩、道路阻断者，应立即报告。','故意隐瞒险情者，从严追究。','故意侵吞粮食者，从严追究。','经核验确有灾阻者，另行处理。','同队人员一律承担相同后果。'];
const evidence1=[['车夫被落石砸伤','灾害造成的困难'],['粮车陷入泥中','灾害造成的困难'],['粮夫趁乱私藏粮食','个人故意行为']];
const evidence2=[['药铺发生失窃','已经可以确认'],['少年携带两包药材','已经可以确认'],['第三包药材去向不明','已经可以确认'],['谁提出计划','仍需要查明'],['店主是否有实际损失','仍需要查明'],['少年一定是主谋','证据不足'],['店主已经没有任何损失','证据不足']];
const witness=[['少年当时携带药包','证言能够支持'],['巷口有一名成年男子','证言能够支持'],['两人之间可能存在关联','证言能够支持'],['两人各自做了什么仍需查明','证言能够支持'],['成年人一定提出盗窃计划','证言不能单独支持'],['少年一定完全受成年人指使','证言不能单独支持']];
const timeline=['成年人多次查看药铺后巷','二人夜间一同来到巷口','少年进入药铺搬运药材','成年人在巷口接应','第三包药材在逃离时受潮损坏','大部分药材被找回'];
const opinion=[['成年人多次查看药铺后巷','认定各自责任'],['少年进入药铺搬运药材','认定各自责任'],['成年人在巷口接应','认定各自责任'],['少年十四岁','少年的处理方式'],['药材大部分已找回','处理店主损失'],['第三包药材受潮损坏','处理店主损失'],['少年家中有人患病','理解案情'],['店主愿意听取解释','理解案情'],['谁最先提出计划仍需判断','认定各自责任']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function attrJson(s){return JSON.stringify(s).replaceAll('"','&quot;')}
function render(html){el.classList.remove('animate');void el.offsetWidth;el.innerHTML=html;el.classList.add('animate');window.scrollTo(0,0)}
function frame(title,body,extra='',question=''){render('<div class="progress">'+(state.scene==='grain'?'场景一 · 一纸重令':'场景二 · 夜半药铺案')+' · 第 '+(state.step+1)+' 幕</div><h2>'+title+'</h2><div class="body">'+body+'</div>'+extra+(question?'<div class="question">教师追问：'+question+'</div>':''))}
function btn(label,fn){return '<button class="primary" onclick="'+fn+'">'+label+'</button>'}
function next(){if(state.scene==='medicine'&&(state.step===1||state.step===2))state.sort={};state.answer=null;state.step++;show()}
function home(){state.scene=null;state.step=0;render('<div class="eyebrow">教师投屏 · 课堂导入</div><h1>律脉千秋·课堂抉择</h1><p class="lead">从两场虚构教学情境出发，在信息逐渐清楚的过程中讨论规则、证据与责任。教师控制点击，学生口头或分组参与。</p><div class="grid"><div class="card"><h3>一纸重令</h3><p>战国秦地。粮队失期、前线缺粮。你制定的命令会如何影响下一次遇险者的选择？</p><button class="primary" onclick="start(&#39;grain&#39;)">进入场景一</button></div><div class="card"><h3>夜半药铺案</h3><p>唐代县署。药材失窃、少年被发现携带药包。证据能把责任查清到哪一步？</p><button class="primary" onclick="start(&#39;medicine&#39;)">进入场景二</button></div></div><p class="small">所有人物、地名、事件、损失均为虚构教学情境。</p>')}
function start(scene){state.scene=scene;state.step=0;state.first=null;state.initial=null;state.focus=[];state.clauses=[];state.sort={};state.invest=null;state.timeline=[];state.opinion={};state.answer=null;show()}
function restart(){state.scene?start(state.scene):home()}
function togglePause(){document.getElementById('pause').classList.toggle('open')}
function skipAnimation(){el.classList.remove('animate')}
function choose(key,value){state[key]=value;show()}
function option(label,fn,detail=''){return '<button class="option" onclick="'+fn+'">'+esc(label)+(detail?'<small>'+esc(detail)+'</small>':'')+'</button>'}
function actions(label='继续'){return '<div class="actions">'+btn(label,'next()')+'</div>'}
function show(){if(!state.scene)return home();state.scene==='grain'?grain():medicine()}
function classify(items,groups,key,nextLabel){const done=Object.keys(state.sort).length===items.length;let html='<div class="cols">'+groups.map(g=>'<div class="slot"><h3>'+g+'</h3>'+items.filter(([t])=>state.sort[t]===g).map(([t])=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div>').join('')+'</div><div class="note">选择一张证据，再决定它能支持哪一栏。允许重新归类。</div>';
html+=items.map(([t])=>'<button class="pill '+(state.answer===t?'on':'')+'" onclick="state.answer='+attrJson(t)+';show()">'+esc(t)+'</button>').join('');
if(state.answer)html+='<div class="actions">'+groups.map(g=>'<button class="link" onclick="place('+attrJson(key)+','+attrJson(state.answer)+','+attrJson(g)+')">'+g+'</button>').join('')+'</div>';
if(done){const accurate=items.every(([t,g])=>state.sort[t]===g);html+='<div class="feedback">'+(accurate?'归类完成。请继续核对证据之间的关系。':'有些结论超出了证据。请想一想：事实、推断与尚待核查的问题有何不同？')+'</div>'+(accurate?actions(nextLabel):'')}
return html}
function place(key,t,g){state.sort[t]=g;state.answer=null;show()}
function grain(){switch(state.step){
case 0:frame('粮车没有按时抵达','战国时期，秦地某县。前线急需粮食，县中粮仓只够支撑七日。三支粮队只到两支。失期的一队称山路遇暴雨；县中也传言有人借雨拖延。','<div class="grid"><div class="card"><h3>仓吏</h3>“若粮食不能及时送到，前线会缺粮。”</div><div class="card"><h3>传令吏</h3>“若不立刻严令，后来的人恐怕都会找借口。”</div></div>'+actions('查看可发布的命令'),'规则既要让粮食运到，也要让官府知道真实情况。');break;
case 1:frame('命令如何写？','只能先发布一条命令，真相尚未查清。选择后，全县粮队都会知道这条规则。',option('限期必达',"choose('first','strict')",'凡运粮逾期者，不问缘由，一律从严处置。军情紧急，命令必须明确。')+option('遇险先报',"choose('first','report')",'遇暴雨、山崩、道路阻断者，须立即报县核验；故意延误者，加重处罚。')+(state.first?'<div class="feedback">'+(state.first==='strict'?'这条命令明确而迅速，可能形成威慑。':'这条命令能让县署及时知道灾情，便于调度。')+'</div>'+actions('查看三日后结果'):'') ,'它最可能解决什么，又可能遗漏什么？');break;
case 2:frame(state.first==='strict'?'三日后：粮食按时到了':'三日后：官府知道了山路情况',state.first==='strict'?'新令公布后，两支粮队加快行程，粮仓得到补给。账册中的“误期”记录减少；失期粮队仍未返回。':'一支粮队报告桥梁被冲坏。县署核验后改道转运，粮食陆续抵达，却比原计划晚了一日；失期粮队仍未返回。','<div class="feedback">'+(state.first==='strict'?'仓吏：“大家都不敢耽误了。”':'军吏：“核验和改道花了时间。”')+'</div>'+actions('继续查看失期粮队'),state.first==='strict'?'误期记录减少，能说明所有人都更愿意守令吗？':'多花一天换来真实消息，代价能接受吗？');break;
case 3:frame('失期粮队找到了','山路泥泞，粮车侧翻。车夫受伤、粮车陷泥；一名粮夫趁乱私藏粮食。粮队没有及时报告险情。',classify(evidence1,['灾害造成的困难','个人故意行为'],'grain','召开临时议事'),'同一队伍中的不同人，能只用一种后果处理吗？');break;
case 4:frame('你要处理的，不只是“误期”','请选出本案最需要优先查清的两件事。不同选择会决定官府先获得什么信息。',['道路和天气是否确实使运输无法继续','受伤车夫能否继续随队','谁决定不向县署报告','私藏粮食的数量和去向','其他粮队是否也曾误期'].map((x,i)=>'<button class="option '+(state.focus.includes(i)?'selected':'')+'" onclick="toggleFocus('+i+')">'+x+'</button>').join('')+(state.focus.length===2?'<div class="feedback">'+focusFeedback()+'</div>'+actions('修改县令告示'):'') ,'规则会反过来影响人们是否愿意提供信息。');break;
case 5:frame('现在，请写出下一条命令','从六句话中选择三句，组成新的县令告示。规则越多，执行和核验也越困难。',clauses.map((x,i)=>'<button class="option '+(state.clauses.includes(i)?'selected':'')+'" onclick="toggleClause('+i+')">'+(i+1)+'．'+x+'</button>').join('')+(state.clauses.length===3?'<div class="feedback">'+clauseFeedback()+'</div><div class="note">告示：'+state.clauses.map(i=>clauses[i]).join(' ')+'</div>'+actions('公布告示'):'') ,'这三条规则会怎样影响下一次遇灾者的行为？');break;
case 6:frame('重罚能解决所有治理问题吗？','我认为，较重的处罚可以________。\n但如果________，人们可能会________。\n因此，治理还需要________。','<div class="actions"><button class="link" onclick="reveal(&#39;clues&#39;)">显示讨论线索</button><button class="link" onclick="reveal(&#39;source&#39;)">史料联想</button></div><div id="clues" class="note" hidden>命令能否及时执行？官府能否得到真实信息？不同行为是否承担相称后果？人们是否愿意在下次危机中合作？</div><div id="source" class="note" hidden>《史记·陈涉世家》：“今亡亦死，举大计亦死，等死，死国可乎？”这可用于讨论极端处罚下的行为选择，并非本虚构运粮事件的法律依据。</div>'+actions('进入本课问题'),'你的结论依据了哪些事实？');break;
default:frame('进入商鞅变法','如果重刑有威慑力，也可能带来代价，商鞅为什么仍强调轻罪重罚？\n接下来分析商鞅变法的历史背景、制度目标与历史局限。','<div class="actions">'+btn('重新体验',"start('grain')")+'<button class="link" onclick="home()">返回首页</button></div><p class="small">本场景中的运粮事件、人物和数字均为虚构教学情境。</p>');}}
function toggleFocus(i){if(state.focus.includes(i))state.focus=state.focus.filter(x=>x!==i);else if(state.focus.length<2)state.focus.push(i);show()}
function focusFeedback(){const f=state.focus;if(f.includes(0)&&f.includes(2))return '你优先核实灾害与未报告的原因，可以进一步判断规则是否影响了报信意愿。';if(f.includes(3))return '私藏粮食涉及个人行为，不能用灾害掩盖；其余责任仍需分别核查。';if(f.includes(1))return '伤情影响车夫履行任务的能力，不能与他人的行为混为一谈。';return '这有助于观察规则的广泛效果，但不能直接说明本队每个人的责任。'}
function toggleClause(i){if(state.clauses.includes(i))state.clauses=state.clauses.filter(x=>x!==i);else if(state.clauses.length<3)state.clauses.push(i);show()}
function clauseFeedback(){let c=state.clauses;if(c.includes(5))return '执行会更简单，但受伤、遇灾与私藏粮食者的责任被混在一起。';if([1,2,3].every(i=>c.includes(i)))return '及时报告与不同故意行为得到区分；核验需要人力，却可能带来更多真实信息。';if(c.includes(4)&&!c.includes(1))return '允许灾阻另行处理，但没有写明何时、如何报告，官府可能无法及时得知。';return '命令较明确。请进一步想想：遇不可控制的灾害时，运粮人为何愿意说明实情？'}
function reveal(id){const x=document.getElementById(id);x.hidden=!x.hidden}
function medicine(){switch(state.step){
case 0:frame('夜半药铺失窃','唐代县署。店主报案：药铺后门被撬，少年清晨携药包离开。药材原本要交给病家。店主想找回药材，查清是谁所为。',option('暂时认定少年是主谋',"choose('initial','chief')")+option('先查明各人行为',"choose('initial','investigate')")+(state.initial?'<div class="feedback">'+(state.initial==='chief'?'药包是重要线索，足以确定调查方向；谁提出计划，仍须查明。':'继续调查保留了区分各人行为的机会；少年是否参与也要查清。')+'</div>'+actions('查看药铺账册'):'') ,'你还想问少年什么？');break;
case 1:frame('药材找回了一部分，损失并未结束','药包内两包药材仍可使用。账册原有三包，第三包去向不明。店主已答应当日交药，延误是否造成损失仍待核实。',classify(evidence2,['已经可以确认','仍需要查明','证据不足'],'medicine1','查看巷口证言'),'返还药材是否一定意味着没有损失？');break;
case 2:frame('巷口证言','证人看见少年抱药包出巷；一名成年男子在巷口向他招手。证人没有听清两人说了什么。',classify(witness,['证言能够支持','证言不能单独支持'],'medicine2','核对户籍与供述'),'“在场”与“提出计划”是一回事吗？');break;
case 3:frame('户籍与供述','户籍记载：少年十四岁。成年人称少年先提到后门无人；少年称成年人让他进去。两份供述相互冲突。',option('先查成年人此前的活动',"choose('invest',0)")+option('先查第三包药材',"choose('invest',1)")+option('先查两人关系',"choose('invest',2)")+(state.invest!==null?'<div class="feedback">'+investText(state.invest)+'</div>'+actions('汇合后续调查'):'') ,'三项调查都合理。为什么优先做这一项？');break;
case 4:frame('后续查验结果','邻铺称成年人多次查看后巷，却无人听见其直接提出盗窃。第三包药材在排水沟旁受潮损坏，脚印不能说明是谁丢弃。两人有往来，亦不能证明每次行动都受指使。','<div class="feedback">先调查的一项给出线索；另外两项也已补齐。请把事实按行动顺序整理。</div>'+actions('重建案发经过'),'哪些证据能支持参与，哪些仍不足以认定首从？');break;
case 5:frame('重建案发经过','按发生顺序点击事件卡。先前获得的线索会形成一条可以核验的时间线。','<div class="note">已排列：'+(state.timeline.map((i,n)=>(n+1)+'．'+timeline[i]).join(' → ')||'尚未开始')+'</div>'+timeline.map((x,i)=>'<button class="pill '+(state.timeline.includes(i)?'muted':'')+'" '+(state.timeline.includes(i)?'disabled':'')+' onclick="addTimeline('+i+')">'+x+'</button>').join('')+'<div class="actions"><button class="link" onclick="state.timeline=[];show()">重排</button></div>'+(state.timeline.length===timeline.length?'<div class="feedback">'+(state.timeline.every((v,i)=>v===i)?'时间线已建立。实际进入药铺、巷口接应和药材损坏可以初步确认；谁先提出计划仍需谨慎判断。':'这条顺序与现有证据不完全相符。可以重排，再讨论哪些先后关系能够确认。')+'</div>'+(state.timeline.every((v,i)=>v===i)?actions('拟写裁断意见书'):''):'') ,'案情更清楚后，还有哪些问题没有唯一答案？');break;
case 6:frame('请为县令提交一份意见','把因素分别放入四个栏目。同一因素只放入一栏；有些事实也会在其他问题中被再次讨论。',opinionBoard(),'如果只强调少年的困境，谁的利益会被忽略？');break;
case 7:frame('裁断的每一步，都要有依据','成年人：继续核实是否提出计划，并按实际参与情况认定责任。少年：确认其参与，依法审查年龄与共同犯罪地位。店主：返还尚在药材，核定受潮部分及可证实的实际损失。','<div class="grid"><div class="card"><h3>店主</h3>“我的损失没有被一句‘可怜’带过。”</div><div class="card"><h3>少年</h3>“我做错了事，但官府也区分了每个人做过的事。”</div></div>'+actions('查看唐律规则'),'理解处境能否代替责任认定？');break;
default:frame('从案卷进入《唐律疏议》','共同犯罪须区分首从：“以造意为首，随从者减一等。”唐律对老、小、废疾等设有特别规定。赃物返还、核定损失与刑罚裁断也应分别处理。','<div class="note">本案人物、药铺、损失和经过均为虚构教学情境。家中患病、店主谅解不自动构成法定减轻事由；不展示未经罪名、赃值和完整案情核定的刑期或赎额。</div><div class="question">唐律如何通过首从、年龄和赃物规则，让裁断既有尺度，也看见具体的人？</div><div class="actions">'+btn('重新体验',"start('medicine')")+'<button class="link" onclick="home()">返回首页</button></div>');}}
function investText(i){return ['邻铺证言提示成年人关注过药铺，但关注不等于提出计划。','受潮药材使损失问题更清楚，但脚印不足以证明是谁丢弃。','两人有往来，可能存在影响，但不等于每次行为均由一人决定。'][i]}
function addTimeline(i){state.timeline.push(i);show()}
function opinionBoard(){const cols=['认定各自责任','少年的处理方式','处理店主损失','理解案情'];let html='<div class="cols">'+cols.map(c=>'<div class="slot"><h3>'+c+'</h3>'+opinion.filter(([t])=>state.opinion[t]===c).map(([t])=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div>').join('')+'</div>';html+=opinion.map(([t])=>'<button class="pill '+(state.answer===t?'on':'')+'" onclick="state.answer='+attrJson(t)+';show()">'+esc(t)+'</button>').join('');if(state.answer)html+='<div class="actions">'+cols.map(c=>'<button class="link" onclick="state.opinion['+attrJson(state.answer)+']='+attrJson(c)+';state.answer=null;show()">'+c+'</button>').join('')+'</div>';if(Object.keys(state.opinion).length===opinion.length)html+='<div class="feedback">'+(opinion.every(([t,c])=>state.opinion[t]===c)?'你已分开考虑行为、年龄、损失与情理背景。':'请再核对：同情或谅解可以帮助理解案情，但不能替代行为、年龄和损失的具体认定。')+'</div>'+actions('提交意见书');return html}
home();
</script></body></html>
