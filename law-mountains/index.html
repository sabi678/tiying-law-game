<section id="title" class="screen title"><div class="title-inner"><div class="seal">律</div><div class="eyebrow">中国法制史沉浸互动游戏</div><h1>律脉千秋</h1><h2>十案录 · 从刑书到新律</h2><p>十个时代，十场足以改变制度走向的案件。你将调查物证、质询证人、适用当时律令，并承担判词的后果。没有分数和等级，只有被你改变的人、制度与结局。</p><div class="actions"><button class="btn primary" onclick="openMap()">进入十案图</button><button class="btn ghost" onclick="continueGame()">继续存卷</button><a class="btn ghost shao-entry-link" href="./shao-yidou/">少了一斗的粟 · 独立秦朝案</a></div></div></section>
<section id="map" class="screen map hidden"><header class="top"><div class="brand"><small>十案相承 · 以案观制</small><b>律脉千秋</b></div><button class="icon" onclick="show('title')">卷首</button></header><div class="map-head"><div class="seal" style="margin:auto;width:55px;height:55px;font-size:23px">十</div><h2>千秋法脉图</h2><p>十卷已经全部开放。可以按时代顺序推进，也可以直接选择任一案件体验。</p><a class="shao-map-link" href="./shao-yidou/"><strong>少了一斗的粟</strong><span>独立秦朝案件 · 对话抉择与制度复盘</span><span aria-hidden="true">进入 →</span></a></div><div id="caseGrid" class="grid"></div></section>

const cases=[
{era:'春秋·郑国',title:'鼎火照夜',sub:'完整沉浸卷 · 铸刑书时代群像',role:'郑国司寇属吏',bg:'s1-0',intro:'公元前536年，子产命人将刑书铸于鼎上。国人第一次能够公开看到罪与刑的规则。晋国叔向来书反对，认为“民知争端”，贵贱将失其序。与此同时，一名平民因旧贵族临事加刑而到铸鼎台喊冤。',people:'子产主张公布刑书以应对社会变化；叔向担忧成文规则破坏礼治；旧族大夫希望保留临事裁量；平民石生要求依公布刑书重审。',evidence:[
 ['刑鼎拓文','法文','鼎上列出若干罪刑，条文简略，部分概念仍需官吏解释。','证明刑罚规则开始公开，百姓能够据此主张预期。','不能证明官吏裁量从此消失，也不等于现代法律平等。','鼎'],
 ['叔向来书','书证','来书主张“议事以制，不为刑辟”，担心民众以条文争利。','反映反对者并非单纯拒绝法律，而是在维护礼治与身份秩序。','不能因其保守就忽略对立法技术和社会冲突的担忧。','书'],
 ['石生旧案','案卷','旧族大夫临事决定加刑，案卷没有事先可知的明确标准。','显示秘密刑和身份裁量可能造成不可预期与差等处理。','个案不必然证明所有临事裁量都属滥用。','卷'],
 ['市井争讼簿','记录','刑书公布后，援引条文争论的人明显增多。','支持叔向关于争讼增加的部分担忧。','争讼增加也可能意味着旧有不满有了表达渠道。','簿']],
stages:[
 ['铸鼎之前','刑书即将浇铸，旧族要求只让官吏阅读。子产问你如何公布。',[['全文铸鼎，并另派法吏在市集解释条文。','public','公开与解释并行，增加可预期性，也承认条文需要说明。'],['只刻刑名，不公开适用条件。','partial','形式上公布，却把关键解释继续留给官吏。'],['停止铸鼎，维持临事议制。','ritual','保留礼治裁量，避免因粗疏条文引发争讼。']]],

 ['落鼎之日','铜水将凝。你必须为刑书制度留下最后一道执行安排。',[['公开主要罪刑、保留解释记录，并允许对越权加刑申诉。','reform','在时代条件下尽量连接公开、解释和救济。'],['刑书只用来教民，贵族仍可不受拘束。','elite','公开规则成为单向控制工具。'],['因争讼增加而毁去刑鼎。','ritual','回到临事议制，避免成文争议。']]],

knowledge:['子产铸刑书与成文法公布','“刑不可知，则威不可测”的传统','叔向对礼治秩序和争讼的担忧','法律公开不等于现代法治完全形成'],boundary:'子产铸刑书及叔向来书见于《左传》。石生及具体申诉程序为教学化虚构，用于呈现公开规则、旧案救济和身份裁量的冲突。'},
{era:'战国·秦',title:'南门徙木',sub:'法令信用与连坐边界',role:'秦国县令',bg:'s1-1',intro:'商鞅新法将行，百姓疑而不信。南门立起三丈之木，重金募人移往北门。赏金兑现后，新法迅速下县。你的辖区却发生逃兵藏匿案：里伍中有人知情、有人外出、有人遭仇家诬告。',people:'变法令史要求迅速立威；里正担心全里连坐；逃兵之母藏匿其子；邻人韩甲借告奸报私仇。',evidence:[

 ['里伍名籍','户籍','同里五户中，两户案发时外出，一户与逃兵家有债务。','身份相邻不等于主观知情或参与。','秦法的连坐设计本就重在互监，不能直接套用现代责任原则。','籍'],

stages:[

 ['里伍开审','令史要求“一里皆坐”，以最快速度制造威慑。',[['出示名籍和告书，分别审查知情、协助与诬告。','bounded','缩小无差别株连，但提高调查成本。',[1,2]],['依身份一律同罪，不再调查。','severe','执行迅速，责任完全由身份关系决定。'],['全里免责，逃兵也不追究。','loose','避免株连，却连独立藏匿行为也被放过。']]],
 ['告奸反噬','韩甲的告书出现矛盾。他承认想借新法夺回争田。',[['核实其他证据，并追究故意诬告。','bounded','维护举报渠道，也为滥用设置代价。'],['只要告发有利治理，就不问真假。','fear','告发数量上升，私人报复也获得制度奖励。'],['取消所有告奸奖励。','loose','诬告减少，真实隐匿线索也可能消失。']]],
 ['新法下县','你要给各里写下最终执行规则。',[['公开奖罚，并将连坐限于明知、协助或故意不报者。','bounded','以可预期规则换取较精细的责任判断。'],['告发越多赏越重，全里有罪一律同坐。','severe','控制效率提高，邻里信任急剧下降。'],['规则由县吏临事决定，无需公布。','fear','新法信用重新依赖官吏个人。']]],
],endings:{bounded:['信与刑之间','新法获得信用，逃兵母因藏匿受罚，外出者免坐，韩甲因诬告被追究。令史批评你削弱威慑，但县中第一次有人明白：告奸不是可以随意借用的私器。'],severe:['举里皆惧','全里被连坐，告发骤增。数月后，县署案牍堆满互相检举的文书。新法无人敢疑，却也无人敢信任邻人。'],fear:['徙木而失信','南门的赏金故事仍被传颂，县中实际执行却因打折承诺和秘密裁量失去信用。百姓服从的是刑罚，不是规则。'],default:['强国之县','新法推动户籍、奖罚与互监，县中秩序迅速改变。它在治理上有效，也让无过者承担了身份连带的代价。']},
knowledge:['徙木立信与法令信用','商鞅变法中的赏罚必信','什伍连坐与告奸机制','富国强兵成效不自动证明全部手段正当'],boundary:'徙木立信见于传统史籍。具体逃兵、争田和诬告案为教学化虚构，旨在呈现连坐的信息功能、责任扩大与激励滥用。'},
{era:'西汉·文帝',title:'缇萦叩阙',sub:'废肉刑与替刑之弊',role:'廷尉府属官',bg:'han',intro:'齐太仓令淳于意获罪，将受肉刑。幼女缇萦随囚车入长安，上书愿没入为婢，并称受刑者“虽欲改过自新，其道莫由”。文帝有意改革，但廷尉府必须回答：废肉刑之后，以何刑替代？',people:'缇萦希望救父并质疑不可逆刑罚；淳于意原案仍需复核；廷尉正重视威慑；狱掾掌握笞刑伤亡记录。',evidence:[

 ['廷尉廷议','廷尉正称肉刑沿用已久，足以示众。',[['出示奏书与行刑簿，讨论刑后复归。','reform','伤害后果与改革目标相互印证。',[0,2]],['只讲缇萦孝心，请求施恩。','pardon','朝堂可能赦免一人而不改制度。'],['沿用时间足以证明旧制合理。','old','制度稳定被置于不可逆伤害之前。']]],
 ['替刑之议','文帝问废肉刑后如何维持罪责轻重。',[['按罪责分等、限制最高笞数并规范刑具。','reform','让轻刑目标进入执行规则。'],['所有肉刑一律改为五百笞。','harsh','便于统一，却可能形成变相死刑。'],['只写“务从宽仁”，由地方掌握。','vague','目标温和，缺少可监督尺度。']]],
 ['伤亡奏报','河东报告有人死于重笞，郡守请求写成旧疾。',[['如实上报并继续降低笞数、记录复核。','reform','承认副作用，使制度能够继续纠错。'],['隐瞒伤亡，维护新制声誉。','harsh','改革名声保住了，纠错依据却消失。'],['立即恢复全部肉刑。','old','解决替刑风险，回到不可逆伤残。']]],
],endings:{reform:['史官之笔','你没有把废肉刑写成完美终点。伤亡、异议和第二次修正都被留在案卷中。后来的史官未必记得你的名字，却看见一项制度如何从后果中学习。'],pardon:['一人得赦','淳于意与缇萦团聚。此事被称为孝行感天的皇恩，另一辆囚车却仍驶往行刑处。个案圆满，普遍规则没有改变。'],harsh:['笞下新伤','肉刑之名从诏令中消失，行刑簿上的死亡却增加。统一而高额的笞刑，让“仁政改革”在执行中变成另一种重刑。'],old:['旧刑如故','朝廷避免了替刑的不确定风险，肉刑继续执行。缇萦那句“其道莫由”留在未采用的奏书里。'],default:['仁政之始','肉刑改革启动，但替代刑的轻重和执行仍需在后续案件中反复修正。']},

{era:'唐·长安',title:'官帛匿盗案',sub:'同居相隐与伪证责任',role:'大理寺评事',bg:'s1-2',intro:'官库失帛，嫌疑人崔六逃入兄长崔安家。崔安拒不告发，并称弟弟整夜在家。唐律允许一定范围亲属“同居相为隐”，但案中还出现伪造不在场证明、官物和可能的共同分赃。',people:'崔六涉嫌盗取官物；崔安主张亲属相隐；库吏坚持不告发即同罪；染坊掌柜提供蓝靛交易记录。',evidence:[

 ['评事判议','你必须分别确定兄弟责任。',[['崔六依盗官物审理；崔安的容隐、伪证和藏赃分别判断。','careful','将总则、行为和证据逐层结合。'],['兄弟一体，判同一罪名。','strict','以宗族身份替代个别责任。'],['直接套用现代亲属拒证权，二人均免。','absolute','把现代制度溯用于唐代。']]],

{era:'南宋·临安',title:'药圃洗冤',sub:'检验、口供与翻异别勘',role:'提刑司属官',bg:'s1-3',intro:'赵员外死于雨夜药圃，赘婿陆惟恭在刑讯后认罪，旋即翻供。唯一目击者顾三与死者有田界往来。现场颈有索沟却无刃伤，县衙仍将灶下短刃列为凶器。',people:'陆惟恭翻供称刑讯认罪；苦主沈素娘只听顾三转述；顾三自称雨中目击；仵作主张复验尸伤。',evidence:[

const base={version:4,unlocked:1,completed:{},traits:{evidence:0,authority:0,mercy:0,reform:0},current:null,stage:0,selected:[],evidenceStep:0,logs:[],ending:null,view:'title'};
let state=load(),currentEv=0,stageChoices=null;
function load(){try{let s=JSON.parse(localStorage.getItem('lvmai-full-v4'));return s&&s.version===4?s:structuredClone(base)}catch(e){return structuredClone(base)}}
function save(){localStorage.setItem('lvmai-full-v4',JSON.stringify(state))}
function show(id){['title','map','play','investigate','ending'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));state.view=id;save()}
function bgStyle(i){if(i===2)return 'url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/han-palace-gate.png) center/cover';if(i<2)return `url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-1.png) ${i*33.333}% center/400% 100%`;if(i<5)return `url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-1.png) ${(i-1)*33.333}% center/400% 100%`;return `url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-2.png) ${(i-5)*33.333}% center/400% 100%`}
function syncExternalProgress(){try{const first=JSON.parse(localStorage.getItem('ding-teach-v2')||'null');if(first&&first.phase==='done'&&first.ending){state.completed[0]=state.completed[0]||{ending:first.ending,logs:first.choices||[]};state.unlocked=Math.max(state.unlocked,2)}for(let i=1;i<8;i++){const s=JSON.parse(localStorage.getItem('av-five-'+i)||'null');if(s&&s.ending){state.completed[i]=state.completed[i]||{ending:s.ending,logs:s.choices||[]};state.unlocked=Math.max(state.unlocked,i+2)}}save()}catch(e){}}
window.unlockVolume=function(i,ending,logs){state.completed[i]={ending:ending||'已完成',logs:logs||[]};state.unlocked=Math.max(state.unlocked,i+2);save()};
function openMap(){syncExternalProgress();show('map');renderMap()}
function renderMap(){const g=document.getElementById('caseGrid');g.innerHTML='';cases.forEach((c,i)=>{const b=document.createElement('button');b.className=`case c${i} ${state.completed[i]?'done':''}`;b.innerHTML=`<div class="case-copy"><i>第${'一二三四五六七八九十'[window.tenCaseOrder?.indexOf(Number(i)) ?? Number(i)]}卷 · ${c.era}</i><h3>${c.title}</h3><p>${c.sub}</p><span class="tag">${state.completed[i]?'重读案卷':'进入案件'}</span></div>`;b.onclick=()=>startCase(i);g.appendChild(b)})}
function startCase(i){state.current=i;state.stage=0;state.selected=[];state.evidenceStep=0;state.logs=[];state.ending=null;save();renderStage()}
function continueGame(){if(state.current===null)return openMap();if(state.view==='investigate'){renderInvestigation();return}if(state.view==='evidenceHearing'){renderEvidenceHearing();return}if(state.view==='ending'&&state.ending){renderEnding();return}renderStage()}
function sceneBackground(i){const el=document.getElementById('scene');if(i===2)el.style.background='url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/han-court.png) center/cover';else if(i<2)el.style.background=`url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-1.png) ${i*33.333}% center/400% 100%`;else if(i<5)el.style.background=`url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-1.png) ${(i-1)*33.333}% center/400% 100%`;else el.style.background=`url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-2.png) ${(i-5)*33.333}% center/400% 100%`}
function renderStage(){const c=cases[state.current];if(state.stage===1&&state.view==='investigate')return renderInvestigation();if(state.view==='evidenceHearing')return renderEvidenceHearing();if(state.stage>=c.stages.length)return finishCase();show('play');sceneBackground(state.current);const s=c.stages[state.stage];stageChoices=s[2];document.getElementById('stageLabel').textContent=`第${'一二三四五六七八'[state.current]}卷 · ${state.stage===0?'时代导入':state.stage===1?'模拟庭审':state.stage===2?'案情突变':'最终裁断'}`;document.getElementById('playTitle').textContent=c.title;document.getElementById('sceneTitle').textContent=s[0];document.getElementById('sceneContext').textContent=state.stage===0?c.intro:c.people;document.getElementById('speaker').textContent=state.stage===0?'案卷旁白':'案中人';document.getElementById('text').textContent=state.stage===0?c.intro:s[1];document.getElementById('choices').innerHTML='';document.getElementById('continueLine').classList.remove('hidden');renderPortraits()}
function renderPortraits(){const l=document.getElementById('portraitLeft'),r=document.getElementById('portraitRight'),n=state.current%4;l.className=`portrait left p${n}`;r.className=`portrait right p${(n+2)%4} dim`}
function advanceStageDialogue(){if(!stageChoices)return;document.getElementById('speaker').textContent=cases[state.current].role;document.getElementById('text').textContent=cases[state.current].stages[state.stage][1];document.getElementById('continueLine').classList.add('hidden');const box=document.getElementById('choices');if(box.children.length)return;stageChoices.forEach((o,k)=>{const req=o[3]||[],ok=req.every(x=>state.selected.includes(x));const b=document.createElement('button');b.className='choice';b.disabled=!ok;b.innerHTML=`<b>${String.fromCharCode(65+k)}</b>${o[0]}<small>${ok?o[2]:'需先在调查中选取相关证据'}</small>`;b.onclick=e=>{e.stopPropagation();choose(o)};box.appendChild(b)});document.getElementById('portraitLeft').classList.add('dim');document.getElementById('portraitRight').classList.remove('dim')}
function choose(o){const tag=o[1];state.logs.push({stage:cases[state.current].stages[state.stage][0],choice:o[0],effect:o[2]});if(['review','careful','documents','bounded','public','balanced','reform','trust','modernize'].includes(tag))state.traits.evidence++;if(['old','elite','strict','real','ritual','authority','severe','confession'].includes(tag))state.traits.authority++;if(['pardon','mercy','family','loose','absolute','modern'].includes(tag))state.traits.mercy++;if(['reform','public','balanced','bounded','review','careful','documents','modernize'].includes(tag))state.traits.reform++;state.ending=tag;state.stage++;if(state.stage===1)state.view='investigate';save();renderStage()}
function renderInvestigation(){const c=cases[state.current];show('investigate');const el=document.getElementById('investigate');if(state.current===2)el.style.backgroundImage='linear-gradient(#090705a8,#090705a8),url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/han-archive.png)';else if(state.current<2)el.style.backgroundImage=`linear-gradient(#090705b4,#090705b4),url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-1.png)`;else if(state.current<5)el.style.backgroundImage=`linear-gradient(#090705b4,#090705b4),url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-1.png)`;else el.style.backgroundImage=`linear-gradient(#090705b4,#090705b4),url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-2.png)`;document.getElementById('invTitle').textContent=c.title;document.getElementById('invIntro').textContent=`你以${c.role}身份进入案卷。四件材料各有证明力和边界，选择两件带入后续模拟庭审。`;renderEvidence()}
function renderEvidence(){const c=cases[state.current],g=document.getElementById('evidenceGrid');g.innerHTML='';c.evidence.forEach((e,i)=>{const b=document.createElement('button');b.className='ev '+(state.selected.includes(i)?'selected':'');b.innerHTML=`<span class="kind">${e[1]}</span><div class="ev-visual"></div><h3>${e[0]}</h3><p>${e[2]}</p>`;b.onclick=()=>openEvidence(i);g.appendChild(b)});document.getElementById('selectedCount').textContent=`已选 ${state.selected.length} / 2`}
function openEvidence(i){currentEv=i;const e=cases[state.current].evidence[i];document.getElementById('modalTitle').textContent=e[0];document.getElementById('modalDesc').textContent=e[2];document.getElementById('modalFact').innerHTML='<b>可以支持：</b>'+e[3];document.getElementById('modalLimit').innerHTML='<b>不能直接证明：</b>'+e[4];document.getElementById('takeBtn').textContent=state.selected.includes(i)?'移出庭审证据':'带入庭审';document.getElementById('takeBtn').onclick=()=>toggleEvidence(i);document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function toggleEvidence(i){const p=state.selected.indexOf(i);if(p>=0)state.selected.splice(p,1);else{if(state.selected.length>=2)return toast('庭审席只能先呈两件证据。');state.selected.push(i)}save();closeModal();renderEvidence()}
function finishInvestigation(){if(state.selected.length!==2)return toast('请选择两件证据带入庭审。');state.stage=1;state.evidenceStep=0;state.view='evidenceHearing';save();renderEvidenceHearing()}
function renderEvidenceHearing(){const c=cases[state.current],idx=state.selected[state.evidenceStep];if(idx===undefined){state.view='play';save();return renderStage()}const e=c.evidence[idx];show('play');state.view='evidenceHearing';sceneBackground(state.current);renderPortraits();document.getElementById('stageLabel').textContent=`第${'一二三四五六七八'[state.current]}卷 · 举证质询 ${state.evidenceStep+1}/2`;document.getElementById('playTitle').textContent=c.title;document.getElementById('sceneTitle').textContent='当庭出示 · '+e[0];document.getElementById('sceneContext').textContent=e[2];document.getElementById('speaker').textContent=c.role;document.getElementById('text').textContent=`此物可以支持：“${e[3]}”但也有人质疑：“${e[4]}”你准备怎样使用它？`;document.getElementById('continueLine').classList.add('hidden');stageChoices=null;const box=document.getElementById('choices');box.innerHTML='';[[`限定在它能够证明的范围内，再与其他材料互证。`,'evidence',`尊重${e[0]}的证明边界。`],[`把它作为全案唯一依据，立即作出判断。`,'overstate',`举证有力，但可能夸大证明力。`],[`先质询来源、形成过程与利害关系，再决定是否采信。`,'review',`把真实性审查带入庭审。`]].forEach((o,k)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${String.fromCharCode(65+k)}</b>${o[0]}<small>${o[2]}</small>`;b.onclick=x=>{x.stopPropagation();state.logs.push({stage:'举证质询·'+e[0],choice:o[0],effect:o[2]});if(o[1]==='evidence'||o[1]==='review')state.traits.evidence++;else state.traits.authority++;state.evidenceStep++;save();renderEvidenceHearing()};box.appendChild(b)})}
function finishCase(){const c=cases[state.current],last=state.ending||'default',data=c.endings[last]||c.endings.default;state.completed[state.current]={ending:data[0],logs:state.logs};state.unlocked=Math.max(state.unlocked,state.current+2);state.ending=last;state.view='ending';save();renderEnding()}
function renderEnding(){const c=cases[state.current],data=c.endings[state.ending]||c.endings.default;show('ending');const el=document.getElementById('ending');if(state.current===2)el.style.backgroundImage='url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/han-court.png)';else if(state.current<5)el.style.backgroundImage='url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-1.png)';else el.style.backgroundImage='url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-2.png)';el.innerHTML=`<div class="end-card"><div class="seal" style="margin:auto">结</div><div class="eyebrow" style="text-align:center;color:#8b3b30">第${'一二三四五六七八'[state.current]}卷结局</div><h1>${data[0]}</h1><div class="epilogue">${data[1]}</div><div class="tabs"><button class="tab on" onclick="tabEnd(this,'review')">选择复盘</button><button class="tab" onclick="tabEnd(this,'knowledge')">法制史知识卷</button><button class="tab" onclick="tabEnd(this,'boundary')">史实边界</button></div><div id="tabPanel" class="tab-panel"></div><div class="end-actions"><button class="btn primary" onclick="replay()">重开本卷</button><button class="btn ghost" style="color:#38291f;background:#d8c095" onclick="nextCase()">归档并继续</button></div></div>`;tabEnd(document.querySelector('.tab'),'review')}
function tabEnd(btn,type){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));btn.classList.add('on');const c=cases[state.current],p=document.getElementById('tabPanel');if(type==='review')p.innerHTML='<h3>你的判词如何形成</h3><ol class="log">'+state.logs.map(x=>`<li><b>${x.stage}</b>：${x.choice}<br><small>${x.effect}</small></li>`).join('')+'</ol>';if(type==='knowledge')p.innerHTML='<h3>本卷核心知识</h3><div class="knowledge">'+c.knowledge.map(x=>`<div>${x}</div>`).join('')+'</div>';if(type==='boundary')p.innerHTML='<h3>史实与教学化虚构</h3><p>'+c.boundary+'</p>'}
function replay(){startCase(state.current)}
function nextCase(){if(state.current===cases.length-1)return showFinal();openMap()}
function showFinal(){show('ending');const vals=state.traits;let title,text;if(vals.evidence>=vals.authority&&vals.reform>=vals.mercy){title='律脉新章';text='你走完十卷，没有把古代制度浪漫化为现代法治，也没有因其局限否定全部发展。你留下的不是一套永远正确的判词，而是一种让证据、规则与后果彼此校验的方法。'}else if(vals.authority>vals.evidence){title='奉律者之困';text='你多次选择确定性、秩序和既有权威。十卷因此迅速合拢，也有一些疑点永远留在副卷。清末新律翻开时，你第一次发现：遵守旧法与回答新问题并非同一件事。'}else{title='法外施恩';text='你多次救下具体的人，却较少留下可普遍适用的规则。百姓称颂你的仁厚，后来者却仍要为相似案件重新寻找出口。'}const el=document.getElementById('ending');el.className='screen ending final';el.style.backgroundImage='url(https://cdn.jsdelivr.net/gh/sabi678/tiying-law-game@3c24410/law-mountains/assets/era-scenes-2.png)';el.innerHTML=`<div class="end-card"><div class="seal" style="margin:auto">成</div><div class="eyebrow" style="color:#8b3b30">十卷总结局</div><h1>${title}</h1><div class="epilogue">${text}</div><div class="tab-panel" style="margin-top:18px;text-align:left"><h3>十卷归档</h3>${Object.keys(state.completed).map(i=>`第${'一二三四五六七八九十'[window.tenCaseOrder?.indexOf(Number(i)) ?? Number(i)]}卷《${(window.tenCaseBooks?.[i]||cases[i])?.title}》：${state.completed[i].ending}`).join('<br>')}</div><div class="end-actions"><button class="btn primary" onclick="openMap()">回看十案图</button><button class="btn ghost" style="color:#38291f;background:#d8c095" onclick="resetAll()">重新开始</button></div></div>`}
function resetAll(){if(!confirm('确定清除十卷全部进度吗？'))return;localStorage.removeItem('lvmai-full-v4');state=structuredClone(base);show('title')}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2500)}
renderMap();
</script><script src="./immersive.js?v=23"></script><script src="./all-volumes.js?v=23"></script><script src="./new-cases.js?v=1"></script><script src="./mentor.js?v=1"></script></body></html>
