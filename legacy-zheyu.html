<style>

header{position:relative;z-index:2;min-height:118px;padding:20px 32px 16px;background:linear-gradient(180deg,#241d16,#33271c);color:#f2dfb6;border-bottom:3px solid var(--gold);display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand .eyebrow,.court-label{font-size:12px;letter-spacing:.28em;color:#c9aa70}.brand h1{margin:4px 0 0;font:800 clamp(28px,4vw,47px)/1 KaiTi,STKaiti,serif;letter-spacing:.12em}.rounds{text-align:right}.rounds b{font:700 22px KaiTi,serif;color:#fff}.sundial{width:112px;height:74px;position:relative;margin:auto;border-radius:112px 112px 8px 8px;background:conic-gradient(from 270deg at 50% 100%,#d7b86d 0 var(--sun),#473c2f var(--sun) 50%,transparent 50%);border:1px solid #92794c;overflow:hidden;transition:.7s}.sundial:after{content:"";position:absolute;bottom:8px;left:53px;width:5px;height:54px;background:#1c1712;transform-origin:50% 100%;transform:rotate(var(--gnomon));transition:.7s}.sundial:before{content:"日晷";position:absolute;z-index:2;bottom:5px;left:0;right:0;font-size:11px;letter-spacing:.3em}
.status-strip{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#6d5a3f;border-bottom:1px solid #715d3c}.meter{background:#e6d4ad;padding:9px 14px}.meter-head{display:flex;justify-content:space-between;font-size:12px}.track{height:5px;background:#bba983;margin-top:6px}.fill{height:100%;background:var(--jade);transition:.5s}.meter.law .fill{background:var(--cinnabar)}
.game{position:relative;z-index:1;display:grid;grid-template-columns:minmax(340px,42%) 28px 1fr;min-height:calc(100vh - 178px)}.investigation,.judgment{padding:25px clamp(20px,3vw,38px)}.investigation{background:linear-gradient(90deg,#e3d0a7,#efdfbd)}.judgment{background:linear-gradient(90deg,#f2e7cd,#e8d5af)}
.river{position:relative;overflow:hidden;background:linear-gradient(90deg,#233e42,#638790,#263e43)}.river:after{content:"≋\A≋\A≋\A≋\A≋\A≋≋\A≋\A≋";white-space:pre;position:absolute;color:#c8e0dd55;font-size:22px;line-height:42px;animation:flow 4s linear infinite}@keyframes flow{to{transform:translateY(42px)}}
.section-title{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid #392d20;padding-bottom:10px;margin-bottom:16px}.section-title h2{font:800 28px KaiTi,serif;margin:0}.section-title span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}.tab{border:1px solid #87714d;background:#d9c49b;color:#3e3428;padding:8px 12px;cursor:pointer}.tab.active{background:var(--ink);color:#f1dfb6}.evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.evidence{position:relative;min-height:105px;text-align:left;padding:12px 13px;border:1px solid #9b8158;background:#f6e8c8;box-shadow:3px 3px 0 #7e6745;cursor:pointer;transition:.2s;overflow:hidden}.evidence:hover{transform:translateY(-2px)}.evidence.selected{outline:3px solid var(--cinnabar);background:#fff1cb}.evidence.used{opacity:.58}.evidence.burn{animation:burn .7s}.evidence.shatter{animation:shatter .75s}@keyframes burn{45%{filter:sepia(1) brightness(.6);transform:scale(.94);box-shadow:inset 0 0 30px #a9260b}100%{filter:none}}@keyframes shatter{35%{transform:translate(4px,-3px) rotate(2deg);filter:contrast(2)}65%{transform:translate(-5px,2px) rotate(-2deg)}100%{transform:none}}.evidence .tag{display:inline-block;font-size:10px;letter-spacing:.15em;color:#fff;background:var(--jade);padding:3px 6px;margin-bottom:7px}.evidence b{display:block;font:700 18px KaiTi,serif}.evidence small{color:var(--muted);line-height:1.4;display:block;margin-top:4px}.seal-mark{position:absolute;right:5px;bottom:-3px;color:#9a2f2877;font:700 35px KaiTi;transform:rotate(-14deg)}
.ledger{margin-top:16px;border-top:1px dashed #8b7755;padding-top:12px;font-size:13px;color:#5e5140;line-height:1.7}.ledger strong{color:var(--cinnabar)}
.case-chip{display:inline-flex;gap:7px;align-items:center;border:1px solid #98805a;padding:5px 9px;font-size:12px;color:#67543a}.case-chip i{width:7px;height:7px;border-radius:50%;background:var(--cinnabar)}.narrative{min-height:180px}.narrative h3{font:800 clamp(25px,3vw,35px) KaiTi,serif;margin:12px 0;color:#6e241e}.narrative p{line-height:1.85;margin:10px 0}.speaker{color:var(--cinnabar);font-weight:bold}.sound{text-align:center;color:#785020;letter-spacing:.4em;font-weight:bold;margin:16px 0}.law-note{border-left:4px solid var(--gold);background:#fff4cf;padding:11px 14px;margin:15px 0;font-size:13px;line-height:1.65}.law-note b{color:#76501d}.choices{display:grid;gap:10px;margin-top:20px}.choice{border:1px solid #725b3e;background:#2e4d44;color:#f8eccf;text-align:left;padding:13px 15px;cursor:pointer;box-shadow:0 3px 0 #1d332d;line-height:1.5}.choice:hover{background:#3d665a}.choice:disabled{cursor:not-allowed;filter:grayscale(1);opacity:.48}.choice .kind{color:#e6bd70;font-size:11px;letter-spacing:.14em;margin-right:7px}.choice small{display:block;color:#d0d7c8;margin-top:4px}.choice.verdict{background:#762c25}.toast{position:fixed;z-index:10;left:50%;bottom:22px;transform:translate(-50%,120px);background:#211d18;color:#f5e5bf;padding:12px 18px;border:1px solid #b58a49;box-shadow:0 8px 28px #0008;transition:.35s;max-width:90%}.toast.show{transform:translate(-50%,0)}
.modal{display:none;position:fixed;z-index:20;inset:0;background:#0d0b09dd;padding:22px;overflow:auto}.modal.open{display:grid;place-items:center}.ending{width:min(760px,100%);background:var(--paper2);border:8px double #6e5535;padding:clamp(24px,5vw,55px);text-align:center;box-shadow:0 15px 70px #000}.ending .stamp{display:inline-grid;place-items:center;width:86px;height:86px;border:4px double var(--cinnabar);color:var(--cinnabar);border-radius:50%;font:800 24px KaiTi;transform:rotate(-8deg)}.ending h2{font:800 42px KaiTi;margin:18px 0 8px}.ending p{line-height:1.8}.scorecards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.scorecards div{background:#e2cfa7;padding:12px}.scorecards b{display:block;font-size:24px}.ending button{border:0;background:var(--cinnabar);color:white;padding:12px 22px;cursor:pointer;margin:5px}.ending .secondary{background:#4f493e}.hidden{display:none!important}
@media(max-width:900px){header{grid-template-columns:1fr auto;padding:16px 20px}.sundial{display:none}.game{grid-template-columns:1fr}.river{height:17px}.river:after{content:"≋ ≋ ≋ ≋ ≋ ≋ ≋ ≋ ≋ ≋ ≋ ≋ ≋";white-space:nowrap;line-height:15px;animation:flowX 4s linear infinite}@keyframes flowX{to{transform:translateX(42px)}}.investigation,.judgment{padding:20px}.evidence-grid{grid-template-columns:repeat(4,minmax(145px,1fr));overflow-x:auto;padding-bottom:10px}.evidence{min-width:145px}.status-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.brand h1{font-size:25px}.rounds b{font-size:17px}.status-strip{font-size:11px}.meter{padding:7px}.investigation,.judgment{padding:16px}.scorecards{grid-template-columns:1fr}.ending h2{font-size:34px}}
</style></head>
<body><main class="shell"><div class="noise"></div>
<header><div class="brand"><div class="eyebrow">南宋 · 临安府署 · 淳熙九年</div><h1>折狱龟鉴·新编</h1></div><div class="sundial" id="sundial"></div><div class="rounds"><div class="court-label">限五轮审结</div><b>第 <span id="round">1</span> 轮 · 余 <span id="left">5</span> 轮</b></div></header>
<section class="status-strip"><div class="meter law"><div class="meter-head"><span>法理合规</span><b id="lawVal">50</b></div><div class="track"><div class="fill" id="lawBar"></div></div></div><div class="meter"><div class="meter-head"><span>苦主 · 沈素娘</span><b id="victimVal">48</b></div><div class="track"><div class="fill" id="victimBar"></div></div></div><div class="meter"><div class="meter-head"><span>被告 · 陆惟恭</span><b id="accusedVal">46</b></div><div class="track"><div class="fill" id="accusedBar"></div></div></div><div class="meter"><div class="meter-head"><span>证人 · 顾三</span><b id="witnessVal">42</b></div><div class="track"><div class="fill" id="witnessBar"></div></div></div></section>
<div class="game"><aside class="investigation"><div class="section-title"><h2>鞫司 · 卷宗</h2><span>先选证，再讯问</span></div><div class="tabs"><button class="tab active" data-filter="all">全卷八证</button><button class="tab" data-filter="物证">物证</button><button class="tab" data-filter="口供">口供</button><button class="tab" data-filter="文书">文书</button></div><div class="evidence-grid" id="evidenceGrid"></div><div class="ledger" id="ledger"><strong>勘验记：</strong>死者赵员外，发现于自宅药圃。颈有细痕，袖中沾墨；更鼓后约一刻气绝。主案与沈家田界、陆沈婚约皆有牵连。</div></aside><div class="river" title="法理不可逾越"></div><section class="judgment"><div class="section-title"><h2>谳司 · 堂审</h2><span id="phaseName">开堂</span></div><div class="narrative" id="narrative"></div><div class="choices" id="choices"></div></section></div>
</main><div class="toast" id="toast"></div><div class="modal" id="endingModal"><div class="ending" id="ending"></div></div>
<script>
const EVIDENCE=[
 {id:'e1',type:'物证',name:'断裂麻绳',desc:'颈痕宽窄相合，绳端沾有药圃青苔。',fake:false},
 {id:'e2',type:'口供',name:'顾三初供',desc:'称二更时见陆惟恭从药圃东门奔出。',fake:false},
 {id:'e3',type:'文书',name:'沈氏田契',desc:'有官印、四至与税契勘合，可核旧界。',fake:false},
 {id:'e4',type:'文书',name:'朱批婚书',desc:'声称知府朱批“婚约不可悔”，墨色尚新。',fake:true},
 {id:'e5',type:'物证',name:'带血短刃',desc:'发现于陆家灶下；血色鲜艳而尸身无刃伤。',fake:true},
 {id:'e6',type:'文书',name:'县令手令',desc:'命里正私下改绘田界，称“令高于律”。',fake:true},
 {id:'e7',type:'物证',name:'药圃木屐',desc:'鞋底夹白垩，尺码与顾三相合。',fake:false},
 {id:'e8',type:'文书',name:'更鼓簿',desc:'巡夜书吏记二更后骤雨，东门泥迹应当清晰。',fake:false}
];
const DEFAULT={round:1,turnsUsed:0,selected:null,used:[],falseUsed:0,law:50,legalCorrect:0,legalTotal:0,favor:{victim:48,accused:46,witness:42},branches:{land:null,marriage:null},flags:{letter:false,silence:false,contradiction:false,deep:false,mainReady:false},log:[],phase:'opening',ended:false};
let state=load();
function load(){try{let s=JSON.parse(sessionStorage.getItem('zheyu-state'));return s&&s.version===1?s:{...structuredClone(DEFAULT),version:1}}catch(e){return {...structuredClone(DEFAULT),version:1}}}
function save(){sessionStorage.setItem('zheyu-state',JSON.stringify(state))}
const scenes={
 opening:{phase:'启卷',title:'雨夜药圃杀人案',text:'<p><span class="speaker">推官：</span>赵员外死于药圃，赘婿陆惟恭被指为凶手。苦主沈素娘与赵家争田，陆又曾与沈家有婚约；唯一目击者顾三，恰是争田的里正。</p><div class="sound">🪵 啪——升堂！</div><p>五轮之内，你可审两件支案、讯问三人或勘验物证。支案裁断会改变顾三证言的可信度。讯问前，须先从左卷选一证。</p>',choices:[['land','审田产纠纷','审查田契与田界，判断顾三是否挟怨。','审理'],['marriage','审婚姻诉讼','审查婚书与当事人意思。','审理'],['askVictim','讯问苦主沈素娘','须引用一件卷证。','讯问'],['askAccused','讯问被告陆惟恭','须引用一件卷证。','讯问'],['inspect','复验药圃','比对痕迹与夜雨。','勘验']]},
 land:{phase:'支案 · 田产',title:'东陌三亩，界石何在',text:'<p>顾三拿出新绘鱼鳞册，称县令手令已将东陌判归赵家。沈素娘则持旧田契，契上四至、税契俱全。</p><div class="law-note"><b>制度辨析：</b>宋代编敕可与律并行，但官员个别手令不是可任意凌驾于律的普遍规范。唐宋法中的“公罪”重在公务过失，“私罪”涉及徇私故意，后者处罚通常更重。</div>',choices:[['landRight','以田契、税契勘合，维持沈氏田界','顾三受托徇私改册，不能托称公罪过失；命重勘鱼鳞册。','律令层级 · 公私罪'],['landWrong','县令之令当然高于律，田归赵家','将个别手令视为可推翻律与合法契据。','律令层级'],['landKind','不问契据，劝双方各退一半','好感或可上升，但产权根据未明。','调处']]},
 marriage:{phase:'支案 · 婚姻',title:'一纸婚书，两家旧约',text:'<p>沈素娘称幼时由父母许给陆家，后因赵家重聘改约。陆惟恭说：“我不要强娶，只求洗去负心之名。”所谓“朱批婚书”竟称知府可令女子强嫁。</p><div class="law-note"><b>史实依据：</b>《宋刑统》承唐律户婚规范；“诸许嫁女，已报婚书及有私约，而辄悔者”有罚，但这不等于现代婚姻自由，更不等于官员可凭朱批强制成婚。</div>',choices:[['marriageRule','辨伪朱批，按当时成约规则处理财礼争议','指出旧法重父母主婚与婚书聘财，但不得伪造官批。','《宋刑统》承唐律'],['marriageModern','直接援引现代婚姻自由，宣布古约自始无效','价值可取，却把现代法溯用于南宋案件。','《民法典》'],['marriageForce','依朱批强令沈氏嫁陆','采信伪文书，且混淆官批与律。','伪证']]},
 askVictim:{phase:'讯问 · 苦主',title:'沈素娘的迟疑',text:'<p><span class="speaker">沈素娘：</span>“赵员外夺田不假，可人命不是儿戏。顾三说二更见陆郎……我也只听他一面。”</p><p>她将袖口掩紧，似藏着一封信。若你先公正审田，或以真证据温言核问，她也许愿意交出。</p>',choices:[['qVictimCalm','据证温问：只核你亲见之事','避免诱导，将传闻与亲历区分。','讯问'],['qVictimThreat','以诬告反坐威吓：不改口便同罪','古法确有诬告反坐，但此处尚未证明她诬告。','讯问']]},
 askAccused:{phase:'讯问 · 被告',title:'陆惟恭陈说去向',text:'<p><span class="speaker">陆惟恭：</span>“我曾去药圃理论婚书，雨落前便从西门走了。顾三欠赵家钱，才替他作证。”</p><p>口供能否继续，取决于他是否相信你在依法审断，而非先定罪后求证。</p>',choices:[['qAccusedFair','展示证据，请其解释矛盾','陈明证据来源，允许辩解。','讯问'],['qAccusedCoerce','上枷逼供，先认罪再核证','以强制口供代替证据印证。','讯问']]},
 inspect:{phase:'勘验 · 药圃',title:'雨痕与足迹',text:'<p>仵作复验：尸体只有索沟，无刃创。东门泥地在骤雨后应留深迹，却只有木屐白垩粉自石灰房一路至药圃。</p><div class="sound">💧  ...  💧</div><div class="law-note"><b>断狱之慎：</b>传统律典重视检验、证据相互印证；现代刑事诉讼更明确禁止以非法方法收集口供，并确立疑罪从无的制度保障。</div>',choices:[['inspectCompare','以更鼓簿对照木屐与现场','用时间、天气和足迹互证。','勘验'],['inspectBlade','认定短刃即凶器','尸身无刃伤，物证与待证事实不相合。','勘验'],['deepCompare','指出古今差异：古有法定刑与反坐，今有罪刑法定、证据裁判与权利保障','触发“鉴古知今”；不能把古代比附、身份差等同现代原则。','古今辨析']]},
 follow:{phase:'合案推演',title:'三案归一，证言可校',text:'<p id="dynamicFollow"></p><div class="sound">⛓️  铮——疑链渐解</div><p>你仍可补审，或在证据链足够时提审顾三。若轮次用尽，系统将强制进入结案。</p>',choices:[['land','补审田产纠纷','影响顾三的利害关系与可信度。','支案'],['marriage','补审婚姻诉讼','影响陆、沈二人的合作程度。','支案'],['askVictim','再问沈素娘','好感超过70可能交出密信。','讯问'],['askAccused','再问陆惟恭','好感低于20将沉默。','讯问'],['askWitness','提审证人顾三','须引用证据击破或印证其证言。','讯问'],['verdict','击鼓结案','依据三维度和证据链判定。','判决']]},
 askWitness:{phase:'讯问 · 证人',title:'顾三再供',text:'<p><span class="speaker">顾三：</span>“小人确在东门见陆惟恭，天虽下雨，也绝不会看错！”</p><p>他的话与更鼓、雨势、足迹之间至少有一处无法并存。</p>',choices:[['qWitness','以所选证据质其东门目击','若证据真实且相关，将揭穿关键矛盾。','讯问'],['qWitnessFavor','许诺免其田案责任，换取改口','以利益交换证言，损害程序可信。','讯问']]},
 verdict:{phase:'谳决',title:'最后一问：谁杀赵员外',text:'<p>案卷将合。请选择判词。判断并非只看“猜中凶手”，还看法条适用、对人的体察与五轮效率。</p><div class="law-note"><b>提示：</b>唐宋律中的诬告反坐、公私罪区分与故杀刑名均有制度依据；但现代刑法强调法律明文、适用平等与罪责刑相适应，不能简单以“反坐”替代独立审判。</div>',choices:[['vWitness','顾三因债受赵驱使，争田败露后以麻绳杀赵并嫁祸陆','证据须由木屐、雨时、索沟与证言矛盾闭合。','主案判决'],['vAccused','陆惟恭因婚约杀人，依顾三初供定罪','若证言未受检验，仍有重大疑点。','主案判决'],['vNoProof','证据不足，暂不作有罪判决','现代原则更接近疑罪从无；古代语境下仍应继续检验追捕。','审慎判决']]
};
function render(){updateMeters();renderEvidence();let sc=scenes[state.phase]||scenes.follow;document.getElementById('phaseName').textContent=sc.phase;document.getElementById('narrative').innerHTML='<span class="case-chip"><i></i>'+sc.phase+'</span><h3>'+sc.title+'</h3>'+sc.text;if(state.phase==='follow'){let cred=state.favor.witness+(state.branches.land==='right'?25:state.branches.land==='wrong'?-20:0);document.getElementById('dynamicFollow').innerHTML='顾三证言当前可信度：<b>'+clamp(cred)+'</b>/100。'+(state.branches.land==='right'?'田契勘合证明他改册偏袒赵家，利害关系显现。':'田案未明，他的利害关系仍藏在雾中。')+(state.flags.letter?' 沈素娘已交出赵催顾三改界的私信。':'');}
 let box=document.getElementById('choices');box.innerHTML='';sc.choices.filter(c=>!(state.branches.land&&c[0]==='land')&&!(state.branches.marriage&&c[0]==='marriage')&&!(state.flags.silence&&c[0]==='askAccused')).forEach(c=>{let b=document.createElement('button');b.className='choice'+(c[0]==='verdict'?' verdict':'');b.innerHTML='<span class="kind">'+c[3]+'</span>'+c[1]+'<small>'+c[2]+'</small>';b.onclick=()=>act(c[0]);box.appendChild(b)});save()}
function renderEvidence(){let filter=document.querySelector('.tab.active')?.dataset.filter||'all',g=document.getElementById('evidenceGrid');g.innerHTML='';EVIDENCE.filter(e=>filter==='all'||e.type===filter).forEach(e=>{let b=document.createElement('button');b.className='evidence '+(state.selected===e.id?'selected ':'')+(state.used.includes(e.id)?'used ':'');b.dataset.id=e.id;b.innerHTML='<span class="tag">'+e.type+'</span><b>'+e.name+'</b><small>'+e.desc+'</small>'+(state.used.includes(e.id)?'<span class="seal-mark">验</span>':'');b.onclick=()=>{state.selected=state.selected===e.id?null:e.id;save();renderEvidence()};g.appendChild(b)})}
function updateMeters(){document.getElementById('round').textContent=Math.min(state.round,5);document.getElementById('left').textContent=Math.max(0,6-state.round);let vals={law:state.law,victim:state.favor.victim,accused:state.favor.accused,witness:state.favor.witness};for(let k in vals){document.getElementById(k+'Val').textContent=clamp(vals[k]);document.getElementById(k+'Bar').style.width=clamp(vals[k])+'%'}document.getElementById('sundial').style.setProperty('--sun',(Math.min(state.round,5)*10)+'%');document.getElementById('sundial').style.setProperty('--gnomon',(-55+state.round*18)+'deg')}
function needsEvidence(id){return ['askVictim','askAccused','askWitness','qVictimCalm','qVictimThreat','qAccusedFair','qAccusedCoerce','qWitness','qWitnessFavor'].includes(id)}
function act(id){if(state.ended)return;if(needsEvidence(id)&&!state.selected){toast('须先从左侧卷宗选中至少一件证据，方可质问。');return}if(['land','marriage','askVictim','askAccused','inspect','askWitness'].includes(id)){state.phase=id;render();return}if(id==='verdict'){state.phase='verdict';render();return}let ev=EVIDENCE.find(e=>e.id===state.selected);if(needsEvidence(id)&&ev){state.used.push(ev.id);let el=document.querySelector('[data-id="'+ev.id+'"]');if(ev.fake){state.falseUsed++;state.law-=14;el?.classList.add('shatter');toast('伪证碎裂！误引伪证触发“诬告反坐”评分惩罚。')}else{el?.classList.add('burn');state.law+=3}state.selected=null}
 let legal=null,delta={};
 const effects={landRight:[true,12,{victim:18,witness:-18}],landWrong:[false,-18,{victim:-22,witness:14}],landKind:[false,-9,{victim:8,witness:5}],marriageRule:[true,11,{victim:12,accused:15}],marriageModern:[false,-6,{victim:18,accused:3}],marriageForce:[false,-20,{victim:-28,accused:-12}],qVictimCalm:[true,7,{victim:15}],qVictimThreat:[false,-12,{victim:-24}],qAccusedFair:[true,7,{accused:17}],qAccusedCoerce:[false,-16,{accused:-30}],inspectCompare:[true,10,{witness:-8}],inspectBlade:[false,-18,{accused:-14}],deepCompare:[true,15,{victim:5,accused:5,witness:5}],qWitness:[true,10,{witness:-14}],qWitnessFavor:[false,-15,{witness:18}]};
 if(effects[id]){legal=effects[id][0];state.law+=effects[id][1];delta=effects[id][2];Object.keys(delta).forEach(k=>state.favor[k]+=delta[k]);state.legalTotal++;if(legal)state.legalCorrect++}
 if(id==='landRight'){state.branches.land='right'}if(id==='landWrong'||id==='landKind'){state.branches.land=id==='landWrong'?'wrong':'mediation'}if(id==='marriageRule'){state.branches.marriage='rule'}if(id==='marriageModern'||id==='marriageForce'){state.branches.marriage=id==='marriageModern'?'modern':'force'}if(id==='deepCompare'){state.flags.deep=true;toast('隐藏成就「鉴古知今」：你没有把古代制度与现代法治简单等同。')}if(id==='inspectCompare')state.flags.contradiction=true;if(id==='qWitness'&&ev&&!ev.fake&&['e7','e8','e1'].includes(ev.id))state.flags.contradiction=true;
 state.turnsUsed++;state.round++;Object.keys(state.favor).forEach(k=>state.favor[k]=clamp(state.favor[k]));state.law=clamp(state.law);if(state.favor.victim>70&&!state.flags.letter){state.flags.letter=true;toast('沈素娘好感超过70：她主动交出赵员外催顾三改界的私密书信。')}if(state.favor.accused<20){state.flags.silence=true;toast('陆惟恭好感低于20：他转为沉默对抗，口供链断裂。')}
 if(id.startsWith('v')){finish(id);return}if(state.turnsUsed>=5){state.phase='verdict';toast('日影已尽！五轮用罄，强制结案。');render();return}state.phase='follow';render()}
function finish(verdict){state.ended=true;state.turnsUsed=Math.min(5,Math.max(1,state.turnsUsed));let A=clamp(Math.round((state.law+(state.legalTotal?state.legalCorrect/state.legalTotal*100:50))/2)-state.falseUsed*5);let B=Math.round((state.favor.victim+state.favor.accused+state.favor.witness)/3);let C=Math.max(20,100-state.turnsUsed*14);let solved=verdict==='vWitness'&&state.flags.contradiction&&(state.branches.land==='right'||state.flags.letter);let title,stamp,desc;if(state.flags.deep&&solved&&A>=65){title='穿越者之思';stamp='鉴古知今';desc='堂上灯火忽然化作屏幕微光。你意识到：古代的反坐、身份差等与比附，不能被浪漫化为现代法治；今天的罪刑法定、平等适用、罪责刑相适应及婚姻自由，是另一套权利结构。'}else if(solved&&A>=72&&B>=65){title='青天';stamp='法情两尽';desc='三案分别审理又彼此印证：田界复正、婚约辨伪、真凶伏法。百姓服判，朝廷擢你为提刑官。'}else if(A>=72&&B<45){title='酷吏';stamp='法直情伤';desc='判词大体合律，却以威逼代替耐心核问。法网虽密，堂下人心尽失，街巷已有怨声。'}else if(B>=65&&A<60){title='和事佬';stamp='情多法少';desc='各方暂且息讼，但田契与婚书的规范层级未厘清，日后的漏洞比今日更深。'}else if(A<55&&B<50){title='糊涂官';stamp='谬断';desc='伪证、手令与口供彼此冲突，你仍仓促结案。监察御史弹劾失入人罪，官印被收。'}else if(verdict==='vNoProof'){title='慎刑留白';stamp='疑狱从慎';desc='你拒绝在证据断裂时强作有罪判决。主案未破，却保住了不枉无辜的底线；限期追缉仍在继续。'}else if(solved){title='能吏';stamp='案结有据';desc='你识破顾三证言与雨痕的矛盾，主案告破；只是支案处理或人情体察仍留有遗憾。'}else{title='疑狱误断';stamp='案结疑存';desc='卷宗形式上合拢了，证据链却没有闭合。真正的矛盾仍藏在雨夜药圃。'}
 let m=document.getElementById('endingModal');document.getElementById('ending').innerHTML='<div class="stamp">'+stamp+'</div><h2>'+title+'</h2><p>'+desc+'</p><div class="scorecards"><div>法理合规<b>'+A+'</b></div><div>人情体察<b>'+B+'</b></div><div>审断效率<b>'+C+'</b></div></div><p><small>真相判定：'+(solved?'证据链闭合':'证据链未闭合')+' · 误用伪证 '+state.falseUsed+' 次 · '+(state.flags.deep?'已获「鉴古知今」':'未触发隐藏成就')+'</small></p><button onclick="restart()">重开新卷</button><button class="secondary" onclick="document.getElementById(\'endingModal\').classList.remove(\'open\')">回看卷宗</button>';m.classList.add('open');save()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2800)}function clamp(n){return Math.max(0,Math.min(100,Math.round(n)))}function restart(){sessionStorage.removeItem('zheyu-state');state={...structuredClone(DEFAULT),version:1};document.getElementById('endingModal').classList.remove('open');render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderEvidence()});render();
</script></body></html>
